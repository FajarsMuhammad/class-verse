<main style="box-sizing: border-box; width: 100%; max-width: 1180px; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px">
<div id="tb-app" style="display: flex; flex-direction: column; gap: 20px"></div>
<script>
(function () {
  // ---- design tokens (sama dengan tokens/tokens.css) ----
  var C = { ink: '#1E1B3A', muted: '#5B5876', line: '#E3E1F0', bg: '#F6F6FB', card: '#FFFFFF', pri: '#4338CA',
            priSoft: '#ECEBFD', priInk: '#312E81', ok: '#2F7D55', okSoft: '#EAF7EF', okInk: '#1F5A3C',
            ambSoft: '#FFF4DE', ambInk: '#7A4A00', red: '#B42318', redSoft: '#FDECEA', redInk: '#8A1C12' };

  // ---- data yang sama dengan app ----
  var FORMATS = [
    { key: 'buku', label: 'Buku fisik', desc: 'Dipinjam di Perpustakaan. Stok dihitung per eksemplar.', icon: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5"></path><path d="M9 7h6"></path>' },
    { key: 'ebook', label: 'E-book', desc: 'PDF dibaca langsung di Kelasverse. Selalu tersedia.', icon: '<rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M9 7h6"></path><path d="M9 11h6"></path><path d="M9 15h3"></path>' },
    { key: 'audio', label: 'Buku audio', desc: 'MP3 atau M4A didengarkan di Kelasverse.', icon: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="5" height="7" rx="2"></rect><rect x="16" y="14" width="5" height="7" rx="2"></rect>' }
  ];
  var RAK = ['Dongeng', 'Novel', 'Komik Edu', 'Sains', 'Matematika', 'Sejarah', 'Inggris', 'Referensi'];
  var LEVELS = ['SD', 'SMP', 'SMA', 'Umum'];
  var COLORS = [
    ['teal', 'Hijau tua', '#0F766E'], ['blue', 'Biru', '#2563EB'], ['brown', 'Cokelat', '#92400E'], ['pink', 'Merah muda', '#BE185D'],
    ['orange', 'Oranye', '#C2410C'], ['green', 'Hijau', '#15803D'], ['purple', 'Ungu', '#4F46E5'], ['red', 'Merah', '#B91C1C']
  ];
  // file di Berkas, sudah difilter per format (audio: MP3/M4A saja)
  var BERKAS = {
    ebook: [{ id: 'f1', name: 'Contoh - Petualangan di Tata Surya.pdf', meta: 'PDF · 0 MB · di Berkas', badge: 'PDF' }],
    audio: []
  };

  var initial = function () {
    return { fmt: 'ebook', title: '', author: '', rak: 'Sains', level: 'SD', copies: 1, color: 'teal', file: null, submitted: false, saved: null };
  };
  var s = initial();

  // ---- helpers ----
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var svg = function (paths, size, color, sw) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + (sw || 2) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none">' + paths + '</svg>';
  };
  var CHECK = '<path d="M5 12l5 5 9-10"></path>';
  var picked = function (on) {
    return 'border: ' + (on ? '2px solid ' + C.pri : '1px solid ' + C.line) + '; background: ' + (on ? C.priSoft : C.card) + '; color: ' + (on ? C.priInk : C.ink);
  };
  var titleOk = function () { return s.title.trim().length > 0; };
  var fileOk = function () { return s.fmt === 'buku' || s.file !== null; };
  var colorOf = function () { return COLORS.filter(function (c) { return c[0] === s.color; })[0]; };
  var fmtLabel = function () { return FORMATS.filter(function (f) { return f.key === s.fmt; })[0].label; };

  var section = function (inner) {
    return '<section style="background: ' + C.card + '; border: 1px solid ' + C.line + '; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0">' + inner + '</section>';
  };
  var stepTitle = function (n, title, sub) {
    return '<div style="display: flex; align-items: flex-start; gap: 12px"><span style="width: 28px; height: 28px; border-radius: 50%; background: ' + C.pri +
      '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex: none">' + n + '</span>' +
      '<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 17px; font-weight: 800">' + title + '</h2>' +
      '<p style="margin: 0; font-size: 13px; color: ' + C.muted + '">' + sub + '</p></div></div>';
  };
  var pills = function (values, current, action, label) {
    return '<div role="radiogroup" aria-label="' + label + '" style="display: flex; flex-wrap: wrap; gap: 8px">' + values.map(function (v) {
      var on = v === current;
      return '<button type="button" role="radio" aria-checked="' + on + '" data-action="' + action + '" data-value="' + esc(v) +
        '" style="font: inherit; font-size: 14px; font-weight: 800; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; ' + picked(on) + '">' + esc(v) + '</button>';
    }).join('') + '</div>';
  };
  var btnStyle = 'font: inherit; font-size: 14px; font-weight: 800; min-height: 40px; padding: 0 14px; border-radius: 12px; cursor: pointer; ';

  // ---- render pieces ----
  function banners() {
    var out = '';
    if (s.saved) {
      var pub = s.saved === 'publish';
      out += '<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: ' + C.okSoft + '">' +
        svg(CHECK, 20, C.okInk) + '<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 800; color: ' + C.okInk + '">' +
        (pub ? 'Buku terbit' : 'Tersimpan sebagai draf') + '</span><span style="font-size: 14px">&#8220;' + esc(s.title) + '&#8221; ' +
        (pub ? 'sudah muncul di rak ' + esc(s.rak) + ' Perpustakaan.' : 'hanya terlihat pengajar sampai diterbitkan.') + '</span></div>' +
        '<a href="Kelola-Buku.html" style="font-weight: 800; font-size: 14px">Lihat katalog</a>' +
        '<button type="button" data-action="reset" style="' + btnStyle + 'border: 1px solid ' + C.line + '; background: ' + C.card + '; color: ' + C.ink + '">Tambah buku lain</button></div>';
    }
    var missing = [];
    if (!titleOk()) missing.push('judul');
    if (!fileOk()) missing.push('file');
    if (s.submitted && missing.length && !s.saved) {
      out += '<div role="alert" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: ' + C.redSoft + '">' +
        svg('<path d="M12 3l10 18H2z"></path><path d="M12 10v4"></path><path d="M12 17.5v.5"></path>', 20, C.red) +
        '<span style="font-size: 14px; font-weight: 700; color: ' + C.redInk + '">Lengkapi dulu: ' + missing.join(' dan ') + '.</span></div>';
    }
    return out;
  }

  function formatSection() {
    return section(stepTitle(1, 'Jenis buku', 'Menentukan cara siswa membaca dan isian berikutnya.') +
      '<div style="display: flex; flex-wrap: wrap; gap: 12px">' + FORMATS.map(function (f) {
        var on = f.key === s.fmt;
        return '<button type="button" aria-pressed="' + on + '" data-action="fmt" data-value="' + f.key + '" style="font: inherit; text-align: left; flex: 1 1 180px; padding: 16px; border-radius: 16px; cursor: pointer; ' +
          'border: ' + (on ? '2px solid ' + C.pri : '1px solid ' + C.line) + '; background: ' + (on ? C.priSoft : C.card) + '; color: ' + C.ink + '; display: flex; flex-direction: column; gap: 8px">' +
          '<span style="display: flex; align-items: center; justify-content: space-between; width: 100%">' + svg(f.icon, 28, on ? C.pri : C.muted) +
          (on ? '<span style="width: 24px; height: 24px; border-radius: 50%; background: ' + C.pri + '; display: flex; align-items: center; justify-content: center">' + svg(CHECK, 16, '#FFFFFF', 3) + '</span>' : '') +
          '</span><span style="font-size: 16px; font-weight: 800">' + f.label + '</span><span style="font-size: 13px; color: ' + C.muted + '">' + f.desc + '</span></button>';
      }).join('') + '</div>');
  }

  function infoSection() {
    var err = s.submitted && !titleOk();
    var input = 'font: inherit; font-size: 15px; height: 44px; padding: 0 12px; border-radius: 12px; color: ' + C.ink + '; box-sizing: border-box; width: 100%; outline-color: ' + C.pri + '; ';
    return section(stepTitle(2, 'Info buku', 'Judul wajib diisi. Yang lain bisa diubah kapan saja.') +
      '<div style="display: flex; flex-direction: column; gap: 6px"><label for="tb-judul" style="font-size: 14px; font-weight: 700">Judul <span style="color: ' + C.red + '">*</span></label>' +
      '<input id="tb-judul" data-input="title" value="' + esc(s.title) + '" placeholder="Contoh: Petualangan di Tata Surya" aria-invalid="' + err + '" aria-describedby="tb-judul-err" style="' + input +
      'border: ' + (err ? '2px solid ' + C.red : '1px solid ' + C.line) + '">' +
      (err ? '<span id="tb-judul-err" style="font-size: 13px; font-weight: 700; color: ' + C.redInk + '">Judul belum diisi.</span>' : '') + '</div>' +
      '<div style="display: flex; flex-direction: column; gap: 6px"><label for="tb-penulis" style="font-size: 14px; font-weight: 700">Penulis <span style="font-weight: 600; color: ' + C.muted + '">(opsional)</span></label>' +
      '<input id="tb-penulis" data-input="author" value="' + esc(s.author) + '" placeholder="Nama penulis atau penerbit" style="' + input + 'border: 1px solid ' + C.line + '"></div>' +
      '<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">Rak</span>' +
      '<span style="font-size: 13px; color: ' + C.muted + '">Siswa menemukan buku di rak ini saat masuk Perpustakaan.</span>' + pills(RAK, s.rak, 'rak', 'Rak') + '</div>' +
      '<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">Jenjang</span>' + pills(LEVELS, s.level, 'level', 'Jenjang') + '</div>');
  }

  function thirdSection() {
    if (s.fmt === 'buku') {
      var step = function (action, label, sym) {
        return '<button type="button" data-action="' + action + '" aria-label="' + label + '" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid ' + C.line +
          '; background: ' + C.card + '; color: ' + C.ink + '; font: inherit; font-size: 22px; font-weight: 800; cursor: pointer">' + sym + '</button>';
      };
      return section(stepTitle(3, 'Jumlah eksemplar', 'Berapa buku fisik yang ada di rak sekolah.') +
        '<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px"><div role="group" aria-label="Jumlah eksemplar" style="display: flex; align-items: center; gap: 8px">' +
        step('dec', 'Kurangi eksemplar', '&#8722;') + '<output aria-live="polite" style="min-width: 56px; text-align: center; font-size: 24px; font-weight: 800">' + s.copies + '</output>' +
        step('inc', 'Tambah eksemplar', '+') + '</div><span style="flex: 1 1 240px; font-size: 13px; color: ' + C.muted + '">Siswa bisa meminjam selama masih ada eksemplar tersedia. ' +
        'Stok berkurang saat dipinjam dan kembali saat dikembalikan.</span></div>');
    }
    var audio = s.fmt === 'audio';
    var files = BERKAS[s.fmt];
    var body;
    if (files.length) {
      body = '<div role="radiogroup" aria-label="Pilih file" style="display: flex; flex-direction: column; gap: 8px">' + files.map(function (f) {
        var on = s.file === f.id;
        return '<button type="button" role="radio" aria-checked="' + on + '" data-action="file" data-value="' + f.id + '" style="font: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; ' +
          'border: ' + (on ? '2px solid ' + C.pri : '1px solid ' + C.line) + '; background: ' + (on ? C.priSoft : C.card) + '; color: ' + C.ink + '">' +
          '<span style="width: 40px; height: 40px; border-radius: 10px; background: ' + C.redSoft + '; color: ' + C.redInk + '; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex: none">' + f.badge + '</span>' +
          '<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 800; font-size: 14px">' + esc(f.name) + '</span><span style="font-size: 12px; color: ' + C.muted + '">' + f.meta + '</span></span>' +
          '<span style="width: 22px; height: 22px; border-radius: 50%; border: ' + (on ? '7px solid ' + C.pri : '2px solid #B4B1C8') + '; box-sizing: border-box; flex: none"></span></button>';
      }).join('') + '</div>' +
        '<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 2px dashed #C9C5F5">' +
        svg('<path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>', 22, C.ok) +
        '<span style="flex: 1 1 220px; font-size: 13px; color: ' + C.muted + '"><b style="color: ' + C.ink + '">Belum ada di Berkas?</b> Upload ' + (audio ? 'MP3 atau M4A' : 'PDF') +
        ' baru, maksimal 50 MB. File otomatis tersimpan di Berkas.</span><button type="button" style="' + btnStyle + 'border: 1px solid ' + C.ok + '; background: ' + C.card + '; color: ' + C.ok + '">Upload file</button></div>';
    } else {
      body = '<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 22px; border-radius: 14px; background: ' + C.bg + '">' +
        '<span style="width: 48px; height: 48px; border-radius: 14px; background: ' + C.ambSoft + '; display: flex; align-items: center; justify-content: center">' + svg(FORMATS[2].icon, 28, C.ambInk) + '</span>' +
        '<span style="font-weight: 800">Belum ada file audio di Berkas</span><span style="font-size: 13px; color: ' + C.muted + '; max-width: 380px">Buku audio butuh file MP3 atau M4A. Upload sekarang, file juga akan tersimpan di Berkas.</span>' +
        '<button type="button" style="' + btnStyle + 'border: none; background: ' + C.ok + '; color: #FFFFFF">Upload file audio</button></div>';
    }
    var err = s.submitted && !fileOk() ? '<span style="font-size: 13px; font-weight: 700; color: ' + C.redInk + '">Pilih file dulu sebelum menyimpan.</span>' : '';
    return section(stepTitle(3, 'File ' + (audio ? 'audio' : 'e-book'), audio ? 'Pilih MP3 atau M4A dari Berkas.' : 'Pilih PDF dari Berkas.') + body + err);
  }

  function colorSection() {
    return section(stepTitle(4, 'Warna sampul', 'Dipakai sebagai sampul di rak. Pilih warna yang mudah dibedakan dari buku lain.') +
      '<div role="radiogroup" aria-label="Warna sampul" style="display: flex; flex-wrap: wrap; gap: 12px">' + COLORS.map(function (c) {
        var on = c[0] === s.color;
        return '<button type="button" role="radio" aria-checked="' + on + '" aria-label="' + c[1] + '" title="' + c[1] + '" data-action="color" data-value="' + c[0] +
          '" style="width: 48px; height: 48px; border-radius: 50%; background: ' + c[2] + '; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: ' +
          (on ? '0 0 0 3px #FFFFFF, 0 0 0 6px ' + c[2] : 'none') + '">' + (on ? svg(CHECK, 18, '#FFFFFF', 3) : '') + '</button>';
      }).join('') + '</div><span style="font-size: 13px; color: ' + C.muted + '">Dipilih: <b style="color: ' + C.ink + '">' + colorOf()[1] + '</b></span>');
  }

  function aside() {
    var pub = s.saved === 'publish';
    var title = titleOk() ? esc(s.title) : 'Judul buku';
    var author = s.author.trim() ? esc(s.author) : 'Penulis';
    var avail = s.fmt === 'buku' ? s.copies + ' dari ' + s.copies + ' eksemplar tersedia' : 'Selalu tersedia';
    var chips = [s.level, fmtLabel(), s.rak].map(function (t) {
      return '<span style="font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: ' + C.priSoft + '; color: ' + C.priInk + '">' + esc(t) + '</span>';
    }).join('');
    var checks = [
      { label: 'Judul diisi', ok: titleOk() },
      { label: s.fmt === 'buku' ? 'Jumlah eksemplar: ' + s.copies : (s.file ? 'File dipilih' : 'File belum dipilih'), ok: fileOk() },
      { label: 'Rak ' + s.rak + ' · ' + s.level, ok: true }
    ].map(function (k) {
      return '<li style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: ' + (k.ok ? C.ink : C.muted) + '"><span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: none; ' +
        (k.ok ? 'background: ' + C.ok + '; border: none' : 'background: ' + C.card + '; border: 2px solid #B4B1C8') + '">' + (k.ok ? svg(CHECK, 12, '#FFFFFF', 4) : '') + '</span><span style="font-weight: 700">' + esc(k.label) + '</span></li>';
    }).join('');
    return '<section style="background: ' + C.card + '; border: 1px solid ' + C.line + '; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px">' +
      '<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-size: 16px; font-weight: 800">Pratinjau di rak</h2>' +
      '<span style="font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: ' + (pub ? C.okSoft : C.ambSoft) + '; color: ' + (pub ? C.okInk : C.ambInk) + '">' + (pub ? 'Terbit' : 'Draf') + '</span></div>' +
      '<div style="background: #F3EEE4; border-radius: 16px; padding: 20px 16px 0; display: flex; justify-content: center"><div style="width: 150px; height: 206px; border-radius: 6px 12px 12px 6px; background: ' + colorOf()[2] +
      '; box-shadow: inset 8px 0 0 rgba(0,0,0,0.18), 0 6px 0 #D9CBB0; padding: 16px 14px 16px 22px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; color: #FFFFFF">' +
      '<span style="font-size: 16px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere">' + title + '</span><span style="font-size: 12px; font-weight: 700; opacity: 0.9">' + author + '</span></div></div>' +
      '<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 800; overflow-wrap: anywhere">' + title + '</span><span style="font-size: 13px; color: ' + C.muted + '">' + author + '</span>' +
      '<div style="display: flex; flex-wrap: wrap; gap: 6px">' + chips + '</div><span style="font-size: 13px; font-weight: 700; color: ' + C.okInk + '">' + avail + '</span></div></section>' +
      '<section style="background: ' + C.card + '; border: 1px solid ' + C.line + '; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">' +
      '<h2 style="margin: 0; font-size: 16px; font-weight: 800">Siap disimpan?</h2><ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">' + checks + '</ul>' +
      '<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">' +
      '<button type="button" data-action="publish" style="font: inherit; font-size: 15px; font-weight: 800; min-height: 48px; border-radius: 14px; border: none; background: ' + C.pri + '; color: #FFFFFF; cursor: pointer">Simpan &amp; terbitkan</button>' +
      '<button type="button" data-action="draft" style="font: inherit; font-size: 14px; font-weight: 800; min-height: 44px; border-radius: 14px; border: 1px solid ' + C.line + '; background: ' + C.card + '; color: ' + C.ink + '; cursor: pointer">Simpan sebagai draf</button>' +
      '<a href="Kelola-Buku.html" style="text-align: center; font-size: 14px; font-weight: 800; padding: 8px; text-decoration: none; color: ' + C.muted + '">Batal</a></div>' +
      '<p style="margin: 0; font-size: 12px; color: ' + C.muted + '">Draf hanya terlihat pengajar. Buku terbit langsung muncul di rak Perpustakaan.</p></section>';
  }

  // ---- mount ----
  var app = document.getElementById('tb-app');
  function render() {
    app.innerHTML =
      '<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px"><div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px">' +
      '<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Tambah buku</h1>' +
      '<p style="margin: 0; font-size: 15px; color: ' + C.muted + '; max-width: 720px">Isi dari atas ke bawah. Pratinjau di kanan menunjukkan tampilan buku di rak Perpustakaan.</p></div></div>' +
      '<div id="tb-banners" style="display: flex; flex-direction: column; gap: 12px">' + banners() + '</div>' +
      '<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">' +
      '<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">' + formatSection() + infoSection() + thirdSection() + colorSection() + '</div>' +
      '<aside id="tb-aside" aria-label="Pratinjau dan simpan" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">' + aside() + '</aside></div>';
  }
  // saat mengetik: perbarui pratinjau saja supaya fokus input tidak hilang
  function renderLive() {
    document.getElementById('tb-aside').innerHTML = aside();
    document.getElementById('tb-banners').innerHTML = banners();
  }

  function save(mode) {
    var ok = titleOk() && fileOk();
    s.submitted = true;
    s.saved = ok ? mode : null;
    render();
    if (!ok) {
      var target = !titleOk() ? document.getElementById('tb-judul') : app.querySelector('[data-action="file"]');
      if (target) target.focus();
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action'), v = el.getAttribute('data-value');
    if (a === 'publish') return save('publish');
    if (a === 'draft') return save('draft');
    if (a === 'reset') { s = initial(); return render(); }
    s.saved = null;
    if (a === 'fmt' && s.fmt !== v) { s.fmt = v; s.file = null; }
    else if (a === 'rak') s.rak = v;
    else if (a === 'level') s.level = v;
    else if (a === 'color') s.color = v;
    else if (a === 'file') s.file = v;
    else if (a === 'inc') s.copies = Math.min(99, s.copies + 1);
    else if (a === 'dec') s.copies = Math.max(1, s.copies - 1);
    render();
    var again = app.querySelector('[data-action="' + a + '"]' + (v ? '[data-value="' + v + '"]' : ''));
    if (again) again.focus();
  });

  app.addEventListener('input', function (e) {
    var key = e.target.getAttribute('data-input');
    if (!key) return;
    s[key] = e.target.value;
    s.saved = null;
    renderLive();
  });

  render();
})();
</script>

</main>
</div>
</div>
</body>
</html>
