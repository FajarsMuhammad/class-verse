<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #DCEFE3; display: flex; justify-content: center; }
.opt { font: inherit; min-height: 104px; border-radius: 18px; border: 4px solid transparent; color: #FFFFFF;
       display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px;
       text-align: left; box-shadow: 0 4px 0 rgba(0,0,0,0.18); cursor: pointer; }
.opt span { font-size: 17px; font-weight: 800; }
.opt[disabled] { cursor: default; }
.opt.mark { border-color: #1E1B3A; }
.opt.dim { opacity: 0.4; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; font-family: Nunito, system-ui, sans-serif; color: #1E1B3A; background: #EAF7EF; display: flex; flex-direction: column; padding: 20px 18px 24px; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Keluar quiz" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1B3A" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
<div style="flex: 1; height: 12px; border-radius: 999px; background: #FFFFFF; overflow: hidden"><div style="width: 20%; height: 100%; background: #4338CA; border-radius: 999px"></div></div>
<span style="font-weight: 800; font-size: 14px">1/5</span>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; padding: 8px 12px; border-radius: 999px; font-weight: 800; font-size: 14px">0:24</span>
<span style="background: #F59E0B; padding: 8px 12px; border-radius: 999px; font-weight: 800; font-size: 14px"><span id="xp">0</span> XP</span>
</div>

<div style="background: #FFFFFF; border-radius: 22px; padding: 22px 20px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 0 #C9E9D5">
<span style="font-size: 12px; font-weight: 800; color: #2F7D55; letter-spacing: 0.06em">FOTOSINTESIS · SOAL 1</span>
<span style="font-size: 22px; font-weight: 800; line-height: 1.3">Di bagian sel mana fotosintesis terjadi?</span>
</div>

<div id="options" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" class="opt" data-id="a" style="background: #4338CA"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l10 18H2z"></path></svg><span>Mitokondria</span></button>
<button type="button" class="opt" data-id="b" style="background: #2F7D55"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12z"></path></svg><span>Kloroplas</span></button>
<button type="button" class="opt" data-id="c" style="background: #C2410C"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg><span>Ribosom</span></button>
<button type="button" class="opt" data-id="d" style="background: #0E7490"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg><span>Inti sel</span></button>
</div>

<div id="feedback" role="status" hidden style="border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
<span id="fb-title" style="font-size: 18px; font-weight: 800"></span>
<span style="font-size: 14px; line-height: 1.55">Kloroplas berisi klorofil yang menangkap cahaya. Mitokondria tempat respirasi, kebalikan dari fotosintesis.</span>
</div>

<div style="flex: 1"></div>
<button type="button" id="next" hidden style="font: inherit; font-weight: 800; font-size: 17px; height: 56px; border-radius: 16px; border: none; background: #4338CA; color: #FFFFFF; box-shadow: 0 4px 0 #2E2794">Lanjut (ulang demo)</button>
<span id="hint" style="text-align: center; font-size: 14px; font-weight: 700; color: #1F5A3C">Ketuk satu jawaban</span>
</div>

<script>
(function () {
  var CORRECT = 'b';
  var opts = Array.prototype.slice.call(document.querySelectorAll('.opt'));
  var fb = document.getElementById('feedback');
  var fbTitle = document.getElementById('fb-title');
  var next = document.getElementById('next');
  var hint = document.getElementById('hint');
  var xp = document.getElementById('xp');

  function pick(id) {
    var right = id === CORRECT;
    opts.forEach(function (b) {
      var bid = b.getAttribute('data-id');
      b.disabled = true;
      b.classList.toggle('mark', bid === CORRECT || bid === id);
      b.classList.toggle('dim', bid !== CORRECT && bid !== id);
    });
    xp.textContent = right ? '10' : '0';
    fbTitle.textContent = right ? 'Benar! +10 XP' : 'Belum tepat, jawabannya Kloroplas';
    fbTitle.style.color = right ? '#1F5A3C' : '#7A4A00';
    fb.style.background = right ? '#FFFFFF' : '#FFF4DE';
    fb.hidden = false; next.hidden = false; hint.hidden = true;
  }

  function reset() {
    opts.forEach(function (b) { b.disabled = false; b.classList.remove('mark', 'dim'); });
    xp.textContent = '0'; fb.hidden = true; next.hidden = true; hint.hidden = false;
  }

  opts.forEach(function (b) { b.addEventListener('click', function () { pick(b.getAttribute('data-id')); }); });
  next.addEventListener('click', reset);
})();
</script>
</body>
</html>
