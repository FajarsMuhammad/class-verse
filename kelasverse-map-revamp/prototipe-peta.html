<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelasverse · Peta Kampus Baru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: cozy, playful, readable for SD kids to adults
   IDEA: a lively storybook campus seen from above, like a board game you can walk into
   PICTURE: the full-screen campus itself: big trees, paths, plaza with twin beringin, wandering students
   COLOUR and TYPE: grass green field, warm sand paths, each building owns its subject colour; ink #23203a outlines; Nunito
   LAYOUT: world fills the screen; HUD floats in four corners; cards slide in from the right */
:root{color-scheme:light dark;--ink:#23203a;--panel:light-dark(#ffffff,#1f1d33);--ptxt:light-dark(#23203a,#f1f0ff);--muted:light-dark(#6b6880,#a9a6c4);--line:light-dark(#e7e5f2,#34314f);--accent:#6c72f5}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#7fbf6f;font:15px/1.4 Nunito,system-ui,sans-serif;color:var(--ptxt)}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:absolute;background:var(--panel);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(35,32,58,.85)}
#me{left:14px;top:14px;padding:10px 14px 10px 10px;display:flex;gap:10px;align-items:center}
.ava{width:46px;height:46px;border-radius:50%;background:#7c83fd;border:2.5px solid var(--ink);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;position:relative}
.lvl{position:absolute;right:-6px;bottom:-6px;background:#ffd23f;color:#23203a;border:2px solid var(--ink);border-radius:10px;font-size:11px;padding:0 5px;font-weight:900}
.nm{font-weight:900;font-size:15px}
.bar{width:150px;height:10px;border-radius:6px;background:var(--line);border:2px solid var(--ink);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c83fd,#b18cff);transition:width .5s}
.stats{display:flex;gap:10px;font-size:12px;color:var(--muted);font-weight:800;margin-top:3px}
.stats b{color:var(--ptxt)}
.coin{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffc93c;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:3px}
#quest{right:14px;top:14px;width:270px;padding:12px 14px}
#quest h3{margin:0;font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
#quest h3 small{font-size:12px;color:var(--muted);font-weight:800}
#quest ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
#quest.closed ul{display:none}
#quest li{display:flex;gap:9px;align-items:center;font-weight:700;font-size:13.5px;padding:7px 8px;border-radius:12px;background:light-dark(#f5f4fb,#2a2843);cursor:pointer}
#quest li .ck{flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--ink);background:var(--panel);display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
#quest li.done .ck{background:#22c55e}
#quest li.done span{text-decoration:line-through;color:var(--muted)}
#quest li em{margin-left:auto;font-style:normal;font-size:12px;font-weight:900;color:#7c5cff;white-space:nowrap}
#online{left:50%;top:14px;transform:translateX(-50%);padding:6px 14px;font-weight:800;font-size:13px;display:flex;gap:8px;align-items:center;white-space:nowrap}
#online i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
#mini{left:14px;bottom:14px;padding:6px;line-height:0}
#mini canvas{width:220px;height:150px;border-radius:12px;cursor:pointer}
#zoom{right:14px;bottom:14px;display:flex;flex-direction:column;overflow:hidden}
#zoom button,#emotes button{font:inherit;font-weight:900;font-size:20px;width:46px;height:44px;border:0;background:var(--panel);color:var(--ptxt);cursor:pointer}
#zoom button+button{border-top:2px solid var(--line)}
#zoom button:hover,#emotes button:hover{background:light-dark(#f0efff,#2d2a4a)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#emotes{left:50%;bottom:14px;transform:translateX(-50%);display:flex;overflow:hidden}
#emotes button{width:48px;font-size:21px}
#emotes button+button{border-left:2px solid var(--line)}
#prompt{left:50%;bottom:76px;transform:translateX(-50%);padding:8px 16px;font-weight:800;font-size:14px;white-space:nowrap;display:none}
#prompt kbd{display:inline-block;background:#ffd23f;border:2px solid var(--ink);border-radius:7px;padding:0 7px;margin-right:6px;font:900 13px Nunito;color:#23203a}
#card{right:14px;top:50%;width:300px;transform:translate(calc(100% + 40px),-50%);transition:transform .28s cubic-bezier(.2,1.3,.4,1);overflow:hidden}
#card.open{transform:translate(0,-50%)}
#card .hd{padding:16px 16px 14px;color:#fff;position:relative}
#card .hd h2{margin:0;font-size:22px;font-weight:900;line-height:1.1}
#card .hd p{margin:4px 0 0;font-weight:700;opacity:.92}
#card .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:10px;border:2px solid #fff;background:rgba(255,255,255,.18);color:#fff;font:900 16px Nunito;cursor:pointer}
#card .bd{padding:14px 16px 16px;display:grid;gap:12px}
#card .row{display:flex;gap:8px;flex-wrap:wrap}
#card .chip{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
#card .ppl{font-weight:800;color:var(--muted);font-size:13.5px}
#card .ppl b{color:var(--ptxt)}
#card .acts{display:flex;gap:8px}
.btn{flex:1;font:900 15px Nunito;padding:11px 10px;border-radius:14px;border:2.5px solid var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);background:var(--panel);color:var(--ptxt)}
.btn.pri{background:#7c83fd;color:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#toast{left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;padding:9px 16px;font-weight:800;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#help{left:14px;top:92px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
#help b{color:var(--ptxt)}
.note{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-size:12px;font-weight:700;color:rgba(35,32,58,.7);pointer-events:none;white-space:nowrap}
@media(max-width:760px){#quest{width:210px}#quest:not(.forced) ul{display:none}#mini{display:none}#help{display:none}#online{top:auto;bottom:128px}.note{display:none}#card{right:8px;left:8px;width:auto;top:auto;bottom:70px;transform:translateY(calc(100% + 90px))}#card.open{transform:none}}
@media(max-width:520px){#me .bar{width:96px}#quest{display:none}}
@media(prefers-reduced-motion:reduce){#card,#toast,.bar i{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="me" class="panel">
  <div class="ava">F<span class="lvl" id="lvl">Lv 3</span></div>
  <div>
    <div class="nm">Fajar <span style="font-weight:700;color:var(--muted);font-size:12.5px">· Siswa</span></div>
    <div class="bar"><i id="xpbar" style="width:40%"></i></div>
    <div class="stats"><span><b id="xp">120</b>/300 XP</span><span><i class="coin"></i><b id="coins">240</b></span><span>Runtun <b>5 hari</b></span></div>
  </div>
</div>
<div id="help" class="panel"><b>WASD</b> jalan · <b>klik</b> tujuan · <b>seret</b> geser peta · <b>E</b> masuk<br>Prototipe desain · siswa lain NPC simulasi</div>
<div id="online" class="panel"><i></i>Fajar Campus · <span id="onl">0</span> online</div>

<div id="quest" class="panel">
  <h3 id="qh">Misi harian <small id="qc">0/3</small></h3>
  <ul id="ql"></ul>
</div>

<div id="mini" class="panel"><canvas id="mm" width="440" height="300"></canvas></div>
<div id="zoom" class="panel">
  <button id="zin" aria-label="Perbesar">+</button>
  <button id="zout" aria-label="Perkecil">−</button>
  <button id="zme" aria-label="Kembali ke avatar" style="font-size:16px">◎</button>
</div>
<div id="emotes" class="panel" aria-label="Emote">
  <button data-e="👋" aria-label="Sapa">👋</button><button data-e="💡" aria-label="Ide">💡</button><button data-e="❓" aria-label="Tanya">❓</button><button data-e="🎉" aria-label="Rayakan">🎉</button>
</div>
<div id="prompt" class="panel"></div>
<div id="toast" class="panel"></div>

<div id="card" class="panel" role="dialog" aria-label="Info gedung">
  <div class="hd" id="chd"><h2 id="cname"></h2><p id="csub"></p><button class="x" id="cx" aria-label="Tutup">✕</button></div>
  <div class="bd">
    <div class="ppl" id="cppl"></div>
    <div class="row" id="crooms"></div>
    <div class="acts"><button class="btn" id="cwalk">Jalan ke sini</button><button class="btn pri" id="center">Masuk</button></div>
  </div>
</div>

<script>
(()=>{
const INK='#23203a', W=2200, H=1500;
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(11);
const R=(a,b)=>a+rnd()*(b-a), pick=a=>a[Math.floor(rnd()*a.length)];
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,k=Math.abs(p);r=Math.round(r+(f-r)*k);g=Math.round(g+(f-g)*k);b=Math.round(b+(f-b)*k);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function poly(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath()}
function fs(c,fill,lw=3){c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=INK;c.stroke()}}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2)}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}

/* ---------- world data (same footprints & entrances as world.json) ---------- */
const PLACES=[
 {id:'angka',name:'Rumah Angka',sub:'Matematika',col:'#2f6fe4',x:260,y:184,w:250,h:194,door:{x:385,y:372},rooms:['Kelas','Diskusi'],base:14},
 {id:'guru',name:'Ruang Guru',sub:'Khusus guru',col:'#5b6475',x:564,y:250,w:196,h:150,door:{x:662,y:400},rooms:['Rapat','Konsultasi'],base:3},
 {id:'sains',name:'Menara Sains',sub:'IPA',col:'#0f9488',x:1010,y:184,w:190,h:220,door:{x:1100,y:398},rooms:['Lab','Kelas'],base:11},
 {id:'perpus',name:'Perpustakaan',sub:'Bahasa & Literasi',col:'#d0457f',x:1640,y:184,w:290,h:186,door:{x:1785,y:364},rooms:['Perpustakaan','Ruang baca'],base:9},
 {id:'galeri',name:'Galeri Budaya',sub:'Sejarah & IPS',col:'#c2691f',x:260,y:1194,w:270,h:176,door:{x:395,y:1362},rooms:['Kelas'],base:6},
 {id:'studio',name:'Studio Kreatif',sub:'Seni & Coding',col:'#7c3aed',x:980,y:1194,w:240,h:168,door:{x:1100,y:1356},rooms:['Kelas','Diskusi'],base:12},
 {id:'kelas',name:'Gedung Kelas',sub:'Kelas live bersama guru',col:'#4f46e5',x:1640,y:1194,w:260,h:192,door:{x:1770,y:1380},rooms:['Kelas live'],base:21},
];
const ARENA={id:'arena',name:'Arena Kuis',sub:'Semua pelajaran',col:'#ea580c',x:1600,y:628,w:460,h:270,door:{x:1830,y:770},rooms:['Kuis cepat','Turnamen'],base:17,cx:1830,cy:763};
const TAMAN={name:'Taman Diskusi',x:160,y:640,w:440,h:300}, ALUN={name:'Alun-alun',x:800,y:640,w:600,h:380};
const SPOTS=[...PLACES,ARENA];
const FOUNT={x:1100,y:800}, POND={x:290,y:800,rx:95,ry:55};
const ROADS=[
 [[200,440],[2000,440]],[[200,440],[200,640]],[[200,940],[200,1415]],[[2000,440],[2000,628]],[[2000,898],[2000,1415]],
 [[200,1110],[2000,1110]],[[200,1415],[2000,1415]],
 [[395,440],[395,640]],[[395,940],[395,1110]],[[1100,440],[1100,640]],[[1100,1020],[1100,1110]],
 [[1780,440],[1780,628]],[[1780,898],[1780,1110]],[[600,830],[800,830]],[[1400,830],[1600,830]],
 [[755,1110],[755,1415]],[[1430,1110],[1430,1415]]];
const SPURS=[[[385,372],[385,440]],[[662,398],[662,440]],[[1100,400],[1100,440]],[[1785,366],[1785,440]],[[395,1366],[395,1415]],[[1100,1358],[1100,1415]],[[1770,1382],[1770,1415]]];

/* walk graph for NPCs */
const N={T0:[200,440],TL:[395,440],TG:[662,440],TC:[1100,440],TR:[1780,440],T1:[2000,440],
 dA:[385,380],dG:[662,408],dS:[1100,406],dP:[1785,372],
 tN:[395,652],tC:[410,880],tE:[590,830],tS:[395,930],tW:[205,655],tW2:[205,925],
 aW:[812,830],aN:[1100,652],a1:[985,935],a2:[1215,935],aE:[1388,830],aS:[1100,1008],
 rW:[1612,830],rN:[1780,642],rC:[1830,770],rS:[1780,888],rE:[2000,642],rE2:[2000,888],
 L0:[200,1110],LL:[395,1110],L7:[755,1110],LC:[1100,1110],L14:[1430,1110],LR:[1780,1110],L1:[2000,1110],
 B0:[200,1415],BG:[395,1415],B7:[755,1415],BS:[1100,1415],B14:[1430,1415],BK:[1770,1415],B1:[2000,1415],
 dGa:[395,1370],dSt:[1100,1364],dK:[1770,1388]};
const ADJ={};for(const k in N)ADJ[k]=[];
'T0-TL TL-TG TG-TC TC-TR TR-T1 TL-dA TG-dG TC-dS TR-dP TL-tN tN-tC tC-tE tC-tS tW-tC tW2-tC T0-tW tW2-L0 tS-LL tE-aW aW-a1 aW-aN aN-TC aN-a2 a1-a2 a1-aS a2-aS a2-aE aE-aN aE-rW rW-rC rN-rC rN-TR rC-rS rS-LR rE-rC rE2-rC T1-rE rE2-L1 aS-LC L0-LL LL-L7 L7-LC LC-L14 L14-LR LR-L1 L0-B0 L1-B1 B0-BG BG-B7 B7-BS BS-B14 B14-BK BK-B1 L7-B7 L14-B14 BG-dGa BS-dSt BK-dK'
 .split(' ').forEach(e=>{const[a,b]=e.split('-');ADJ[a].push(b);ADJ[b].push(a)});
const DOOR={dA:'angka',dG:'guru',dS:'sains',dP:'perpus',dGa:'galeri',dSt:'studio',dK:'kelas',rC:'arena'};
const DOORNODE=Object.fromEntries(Object.entries(DOOR).map(([k,v])=>[v,k]));
const HANG=['a1','a2','aW','aE','aN','tC','tE','tN','rW','aS'];
function bfs(a,b){const prev={[a]:null},q=[a];while(q.length){const n=q.shift();if(n===b)break;for(const m of ADJ[n])if(!(m in prev)){prev[m]=n;q.push(m)}}const p=[];let n=b;while(n!=null){p.unshift(n);n=prev[n]}return p[0]===a?p:[a]}
function nearestNode(x,y){let best=null,bd=1e9;for(const k in N){const d=(N[k][0]-x)**2+(N[k][1]-y)**2;if(d<bd){bd=d;best=k}}return best}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
const roadDist=(x,y)=>Math.min(...ROADS.concat(SPURS).map(s=>segDist(x,y,s[0],s[1])));
const inRect=(x,y,r,m=0)=>x>r.x-m&&x<r.x+r.w+m&&y>r.y-m&&y<r.y+r.h+m;

/* ---------- trees ---------- */
const PAL={g1:['#2c6a40','#4a9650','#6cb95c','#a2dc7e'],g2:['#3c7a36','#64a646','#8cc957','#c4e88c'],pink:['#a83d64','#d9618b','#f191b2','#ffd5e3'],orange:['#a8321e','#d9502c','#f27c3c','#ffc27c'],beri:['#21573a','#3a7d48','#56a055','#86c46c']};
const TC={};
function treeCanvas(type,r,pal){
 const key=type+r+pal;if(TC[key])return TC[key];
 const S=2,wd=Math.ceil(r*3+20),ht=Math.ceil(r*3.4+24),cv=document.createElement('canvas');cv.width=wd*S;cv.height=ht*S;
 const c=cv.getContext('2d');c.scale(S,S);const ox=wd/2,oy=ht-6;c.translate(ox,oy);c.lineJoin=c.lineCap='round';
 const P=PAL[pal]||PAL.g1, lr=mulberry32(r*97+type.length);
 const trunk=(h,w)=>{poly(c,[[-w*1.4,0],[-w,-h],[w,-h],[w*1.4,0]]);fs(c,'#8a5a34',2.5);c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=2;c.beginPath();c.moveTo(-w*.4,-4);c.lineTo(-w*.3,-h+4);c.stroke()};
 const blobs=(cy,B,P,dots)=>{
  for(const[dx,dy,f]of B){circ(c,dx*r,cy+dy*r,f*r+2.6);c.fillStyle=INK;c.fill()}
  for(const[dx,dy,f]of B){circ(c,dx*r,cy+dy*r,f*r);c.fillStyle=P[0];c.fill()}
  for(const[dx,dy,f]of B){circ(c,dx*r-f*r*.1,cy+dy*r-f*r*.14,f*r*.86);c.fillStyle=P[1];c.fill()}
  for(const[dx,dy,f]of B){if(dy>.3)continue;circ(c,dx*r-f*r*.32,cy+dy*r-f*r*.38,f*r*.42);c.fillStyle=P[2];c.fill()}
  c.fillStyle=P[3];for(let i=0;i<(dots||8);i++){const[dx,dy,f]=B[Math.floor(lr()*B.length)],a=lr()*6.28,d=lr()*f*r*.7;circ(c,dx*r+Math.cos(a)*d,cy+dy*r+Math.sin(a)*d-f*r*.2,1.6+lr()*1.6);c.fill()}
 };
 if(type==='round'||type==='bloom'){trunk(r*.95,r*.11);
  const B=[[0,.05,1],[-.58,.2,.64],[.58,.2,.64],[-.32,-.42,.62],[.34,-.4,.6],[0,.42,.58]];
  if(type==='bloom'){blobs(-r*1.5,B.map(b=>[b[0],b[1]+.08,b[2]*.95]),PAL.g1,0);blobs(-r*1.58,B.map(b=>[b[0]*.92,b[1]-.02,b[2]*.86]),P,26)}else blobs(-r*1.5,B,P,10)}
 else if(type==='beri'){for(const dx of[-.22,0,.2]){poly(c,[[dx*r-r*.1,0],[dx*r-r*.06,-r*1],[dx*r+r*.06,-r*1],[dx*r+r*.1,0]]);fs(c,'#7a4e2d',2.5)}
  c.strokeStyle='#6b4428';c.lineWidth=1.8;for(let i=0;i<14;i++){const x=(lr()-.5)*r*1.9;c.beginPath();c.moveTo(x,-r*1.05);c.lineTo(x+(lr()-.5)*4,-r*(.25+lr()*.45));c.stroke()}
  blobs(-r*1.45,[[0,0,1],[-.82,.18,.7],[.82,.18,.7],[-.45,-.42,.72],[.45,-.42,.72],[0,-.62,.62],[-1.1,.42,.5],[1.1,.42,.5],[0,.38,.66]],P,14)}
 else if(type==='pine'){trunk(r*.5,r*.09);for(let i=0;i<3;i++){const w=r*(1.05-i*.28),y=-r*.45-i*r*.62;poly(c,[[-w,y],[w,y],[w*.2,y-r*.9],[0,y-r*1.05],[-w*.2,y-r*.9]]);fs(c,'#2f7d55',2.6);poly(c,[[-w*.86,y-3],[0,y-3],[0,y-r*.98],[-w*.18,y-r*.86]]);c.fillStyle='#48a26c';c.fill()}}

function renderMe(){$('xp').textContent=xp;$('xpbar').style.width=(xp/need*100)+'%';$('coins').textContent=coins;$('lvl').textContent='Lv '+lvl}
let toastT;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}
function gain(n){xp+=n;coins+=Math.round(n/2);if(xp>=need){xp-=need;lvl++;need+=100;toast('Naik level! Sekarang Level '+lvl)}renderMe()}
function enter(s){const q=QUESTS.find(q=>q.id===s.id&&!q.done);if(q){q.done=true;renderQuests();gain(q.xp);toast(`Misi selesai: ${q.text} · +${q.xp} XP`)}else toast(s.lock?'Ruang Guru hanya untuk guru':`Masuk ke ${s.name}…`);player.emote={ch:s.lock?'🔒':'✨',t:0}}
renderQuests();renderMe();
$('qh').onclick=()=>{$('quest').classList.toggle('closed');$('quest').classList.toggle('forced')};
$('ql').onclick=e=>{const li=e.target.closest('li');if(!li)return;const s=SPOTS.find(s=>s.id===QUESTS[li.dataset.i].id);openCard(s);walkTo(s)};
let cardSpot=null;
function openCard(s){cardSpot=s;$('chd').style.background=s.col;$('cname').textContent=s.name;$('csub').textContent=s.sub;$('cppl').innerHTML=`<b>${s.base+inside[s.id]}</b> orang di dalam sekarang`;$('crooms').innerHTML=s.rooms.map(r=>`<span class="chip">${r}</span>`).join('');$('card').classList.add('open')}
$('cx').onclick=()=>{$('card').classList.remove('open');cardSpot=null};
$('cwalk').onclick=()=>{if(cardSpot)walkTo(cardSpot)};
$('center').onclick=()=>{if(cardSpot)enter(cardSpot)};
document.querySelectorAll('#emotes button').forEach(b=>b.onclick=()=>{player.emote={ch:b.dataset.e,t:0}});
$('zin').onclick=()=>zoomAt(VW/2,VH/2,1.2);$('zout').onclick=()=>zoomAt(VW/2,VH/2,1/1.2);$('zme').onclick=()=>{cam.follow=true};

/* ---------- movement ---------- */
function blocked(x,y){if(x<24||y<40||x>W-24||y>H-14)return true;for(const b of footprints)if(x>b.x+8&&x<b.x+b.w-8&&y>b.y+b.h*.3&&y<b.y+b.h-14)return true;
 if(Math.hypot((x-FOUNT.x)/62,(y-FOUNT.y)/40)<1)return true;if(Math.hypot((x-POND.x)/(POND.rx+4),(y-POND.y)/(POND.ry+4))<1)return true;return false}
const keys={};let target=null,route=[];
function walkTo(s){const a=nearestNode(player.x,player.y),b=DOORNODE[s.id];route=bfs(a,b).map(k=>N[k]);route.push([s.door.x,s.door.y]);target=null;cam.follow=true}
function stepToward(a,tx,ty,sp,dt){const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d<2)return true;const m=Math.min(d,sp*dt);setDir(a,dx,dy);a.x+=dx/d*m;a.y+=dy/d*m;a.moving=true;a.ph+=dt*sp*.11;return d-m<2}
function setDir(a,dx,dy){a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
function updPlayer(dt){let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);player.moving=false;
 if(mx||my){route=[];target=null;cam.follow=true;const l=Math.hypot(mx,my),vx=mx/l*player.speed*dt,vy=my/l*player.speed*dt;setDir(player,mx,my);if(!blocked(player.x+vx,player.y))player.x+=vx;if(!blocked(player.x,player.y+vy))player.y+=vy;player.moving=true;player.ph+=dt*player.speed*.11}
 else if(route.length){if(stepToward(player,route[0][0],route[0][1],player.speed,dt))route.shift()}
 else if(target){const dx=target[0]-player.x,dy=target[1]-player.y,d=Math.hypot(dx,dy);if(d<3)target=null;else{const m=Math.min(d,player.speed*dt),nx=player.x+dx/d*m,ny=player.y+dy/d*m;setDir(player,dx,dy);let mv=false;if(!blocked(nx,player.y)){player.x=nx;mv=true}if(!blocked(player.x,ny)){player.y=ny;mv=true}if(!mv)target=null;player.moving=mv;player.ph+=dt*player.speed*.11}}}
function updNPC(a,dt){
 if(a.state==='inside'){a.timer-=dt;if(a.timer<=0){inside[a.in]--;a.in=null;a.state='idle';a.timer=R(.5,2);a.alpha=0}return}
 if(a.alpha<1)a.alpha=Math.min(1,a.alpha+dt*2.5);
 if(a.state==='idle'){a.moving=false;a.timer-=dt;if(!a.emote&&rnd()<dt*.05)a.emote={ch:pick(['💡','📚','⭐','❓','✏️','💬']),t:0};if(a.timer<=0){const tg=rnd()<.45?pick(Object.keys(DOOR)):pick(HANG);a.wp=bfs(a.node,tg).slice(1);a.state='walk';if(!a.wp.length){a.state='idle';a.timer=1}}return}
 const n=a.wp[0];if(!n){a.state='idle';a.timer=1;return}
 if(stepToward(a,N[n][0]+a.ox,N[n][1]+a.oy,a.speed,dt)){a.node=n;a.wp.shift();if(!a.wp.length){if(DOOR[n]&&rnd()<.6){a.state='inside';a.in=DOOR[n];inside[a.in]++;a.timer=R(6,20);a.alpha=0}else{a.state='idle';a.timer=HANG.includes(n)?R(4,12):R(1,3);a.dir=pick(['down','left','right'])}}}}

/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.target.tagName==='INPUT')return;keys[k]=true;if(k==='e'&&nearSpot)enter(nearSpot);if(k==='f')cam.follow=true;if(k==='+'||k==='=')zoomAt(VW/2,VH/2,1.2);if(k==='-')zoomAt(VW/2,VH/2,1/1.2);if('1234'.includes(k)&&k.length===1)player.emote={ch:['👋','💡','❓','🎉'][+k-1],t:0};if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function zoomAt(sx,sy,f){const[wx,wy]=toWorld(sx,sy);cam.z=Math.max(minZ(),Math.min(1.9,cam.z*f));const[nx,ny]=toWorld(sx,sy);cam.x+=wx-nx;cam.y+=wy-ny;if(f<1||sx!==VW/2)cam.follow=cam.follow&&f!==1&&sx===VW/2}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.1:1/1.1)},{passive:false});
let down=null,hoverSpot=null,hoverNpc=null,mouse=[-1,-1];
const ptrs=new Map();let pinch=0;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}down={x:e.offsetX,y:e.offsetY,cx:cam.x,cy:cam.y,drag:false}});
stage.addEventListener('pointermove',e=>{mouse=[e.offsetX,e.offsetY];if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
 if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pinch);pinch=d;if(down)down.drag=true;return}
 if(down){const dx=e.offsetX-down.x,dy=e.offsetY-down.y;if(!down.drag&&Math.hypot(dx,dy)>6){down.drag=true;cam.follow=false;stage.classList.add('drag')}if(down.drag){cam.x=down.cx-dx/cam.z;cam.y=down.cy-dy/cam.z}}});
stage.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;stage.classList.remove('drag');if(!down)return;const d=down;down=null;if(d.drag)return;
 if(hoverNpc){hoverNpc.emote={ch:'👋',t:0};hoverNpc.dir=hoverNpc.x<player.x?'right':'left';toast(`${hoverNpc.name}: ${pick(LINES)}`);return}
 const[wx,wy]=toWorld(e.offsetX,e.offsetY);const s=spotAt(wx,wy);if(s){openCard(s);return}route=[];target=[wx,wy];cam.follow=true});
stage.addEventListener('pointerleave',()=>{mouse=[-1,-1]});
mm.addEventListener('click',e=>{const r=mm.getBoundingClientRect();cam.x=(e.clientX-r.left)/r.width*W;cam.y=(e.clientY-r.top)/r.height*H;cam.follow=false});
function spotAt(x,y){for(const p of PLACES)if(inRect(x,y,p))return p;if(Math.hypot((x-ARENA.cx)/228,(y-ARENA.cy)/134)<1)return ARENA;return null}

/* ---------- render ---------- */
let nearSpot=null,last=performance.now(),onlineBase=148;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 updPlayer(dt);for(const a of npcs)updNPC(a,dt);
 for(const a of[player,...npcs])if(a.emote){a.emote.t+=dt;if(a.emote.t>2.6)a.emote=null}
 for(const f of flies){f.a+=(rnd()-.5)*dt*4;f.x+=Math.cos(f.a)*30*dt;f.y+=Math.sin(f.a)*22*dt;f.ph+=dt;if(f.x<200||f.x>2000||f.y<460||f.y>1420)f.a+=Math.PI*dt*4}
 for(const c of clouds){c.x+=c.v*dt;if(c.x>W+300)c.x=-300}
 if(cam.follow){cam.x+=(player.x-cam.x)*Math.min(1,dt*5);cam.y+=(player.y-40-cam.y)*Math.min(1,dt*5)}
 clampCam();
 nearSpot=null;for(const s of SPOTS)if(Math.hypot(player.x-s.door.x,player.y-s.door.y)<64)nearSpot=s;
 const pe=$('prompt');if(nearSpot){pe.style.display='block';pe.innerHTML=`<kbd>E</kbd>Masuk ${nearSpot.name}`}else pe.style.display='none';
 const[mwx,mwy]=toWorld(...mouse);hoverSpot=mouse[0]<0?null:spotAt(mwx,mwy);hoverNpc=null;
 if(mouse[0]>=0)for(const a of npcs){if(a.state==='inside')continue;const[sx,sy]=toScreen(a.x,a.y-20);if(Math.hypot(sx-mouse[0],sy-mouse[1])<18*Math.max(1,cam.z)){hoverNpc=a;break}}
 if(!down)stage.style.cursor=hoverSpot||hoverNpc?'pointer':'grab';
 const z=cam.z,c=ctx;c.setTransform(DPR*z,0,0,DPR*z,DPR*(VW/2-cam.x*z),DPR*(VH/2-cam.y*z));c.imageSmoothingQuality='high';
 const vx0=cam.x-VW/2/z,vy0=cam.y-VH/2/z,vw=VW/z,vh=VH/z;
 c.fillStyle='#7fbf6f';c.fillRect(vx0,vy0,vw,vh);
 const sx0=Math.max(0,vx0),sy0=Math.max(0,vy0),sx1=Math.min(W,vx0+vw),sy1=Math.min(H,vy0+vh);
 c.drawImage(ground,sx0*GS,sy0*GS,(sx1-sx0)*GS,(sy1-sy0)*GS,sx0,sy0,sx1-sx0,sy1-sy0);
 // pond glints
 for(let i=0;i<5;i++){const k=(t*.3+i*.2)%1;c.fillStyle=`rgba(255,255,255,${Math.sin(k*Math.PI)*.8})`;rr(c,POND.x-60+i*28,POND.y-20+((i*37)%40),10,2.5,1.2);c.fill()}
 // sorted
 const list=objs.filter(o=>{const y=o.y;if(y<vy0-40||y>vy0+vh+260)return false;if(o.k==='t')return o.t.x>vx0-o.t.r*1.6&&o.t.x<vx0+vw+o.t.r*1.6;if(o.k==='b')return o.p.x+o.p.w>vx0-40&&o.p.x<vx0+vw+40;return o.d.x>vx0-100&&o.d.x<vx0+vw+100});
 for(const a of npcs)if(a.state!=='inside')list.push({k:'a',a,y:a.y});list.push({k:'a',a:player,y:player.y});
 list.sort((p,q)=>p.y-q.y);
 for(const o of list){
  if(o.k==='t'){const tr=o.t,tc=tr.tc;c.save();c.translate(tr.x,tr.y);c.transform(1,0,Math.sin(t*1.1+tr.ph)*tr.sw,1,0,0);c.drawImage(tc.cv,-tc.ox,-tc.oy,tc.wd,tc.ht);c.restore()}
  else if(o.k==='b'){const{p,b}=o,hl=hoverSpot===p||cardSpot===p;if(hl){c.save();c.shadowColor=p.col;c.shadowBlur=26*z;}c.drawImage(b.cv,p.x-b.pad,p.y-b.pad,p.w+b.pad*2,p.h+b.pad*2);if(hl)c.restore()}
  else if(o.k==='d')drawDecor(c,o.d,t);
  else drawAvatar(c,o.a,t)}
 if(hoverSpot===ARENA||cardSpot===ARENA){ell(c,ARENA.cx,ARENA.cy,232,138);c.strokeStyle=ARENA.col;c.lineWidth=5;c.globalAlpha=.6+Math.sin(t*5)*.3;c.stroke();c.globalAlpha=1}
 // butterflies & cloud shadows
 for(const f of flies){const s=Math.abs(Math.sin(f.ph*14));c.fillStyle=f.cl;c.strokeStyle=INK;c.lineWidth=1;for(const sd of[-1,1]){ell(c,f.x+sd*3*s,f.y,3.6*s+.5,3);c.fill();c.stroke()}}
 c.fillStyle='rgba(35,32,58,.06)';for(const cl of clouds){for(const[dx,dy,r]of[[0,0,90],[70,10,70],[-70,14,64],[20,-30,60]]){circ(c,cl.x+dx*cl.s,cl.y+dy*cl.s,r*cl.s);c.fill()}}
 // screen pass
 c.setTransform(DPR,0,0,DPR,0,0);c.textAlign='center';c.textBaseline='middle';
 const label=(x,y,txt,col,count,dark)=>{c.font='900 13px Nunito';const w=c.measureText(txt).width+34;rr(c,x-w/2,y-13,w,26,13);c.fillStyle=dark?'#23203a':'#fff';c.fill();c.strokeStyle=INK;c.lineWidth=2.5;c.stroke();circ(c,x-w/2+13,y,5);c.fillStyle=col;c.fill();c.fillStyle=dark?'#ffd23f':INK;c.fillText(txt,x+6,y+1);if(count){c.font='900 11px Nunito';const cw=c.measureText(count).width+12;rr(c,x+w/2-cw/2,y-22,cw,17,8.5);c.fillStyle=col;c.fill();c.strokeStyle=INK;c.lineWidth=2;c.stroke();c.fillStyle='#fff';c.fillText(count,x+w/2,y-13)}};
 for(const s of SPOTS){const top=s===ARENA?s.y-74:s.y-4;const[x,y]=toScreen(s.x+s.w/2,top);if(x<-120||x>VW+120||y<-60||y>VH+60)continue;label(x,y,(s.lock?'🔒 ':'')+s.name,s.col,String(s.base+inside[s.id]),s===ARENA);
  const q=QUESTS.find(q=>q.id===s.id&&!q.done);if(q){const by=y-34+Math.sin(t*4)*4;circ(c,x,by,12);c.fillStyle='#ffd23f';c.fill();c.strokeStyle=INK;c.lineWidth=2.5;c.stroke();c.fillStyle=INK;c.font='900 15px Nunito';c.fillText('!',x,by+1)}}
 for(const zn of[TAMAN,ALUN]){const[x,y]=toScreen(zn.x+zn.w/2,zn.y);label(x,y,zn.name,'#22c55e')}
 const tag=(a,dark)=>{const[x,y]=toScreen(a.x,a.y+10);c.font='800 11.5px Nunito';const w=c.measureText(a.name).width+14;rr(c,x-w/2,y,w,19,9.5);c.fillStyle=dark?'#5b5fd6':'rgba(255,255,255,.95)';c.fill();c.strokeStyle=INK;c.lineWidth=1.8;c.stroke();c.fillStyle=dark?'#fff':INK;c.fillText(a.name,x,y+10)};
 for(const a of npcs){if(a.state==='inside')continue;if(a===hoverNpc||Math.hypot(a.x-player.x,a.y-player.y)<120)tag(a)}tag(player,true);
 for(const a of[...npcs,player]){if(!a.emote||a.state==='inside')continue;const k=a.emote.t,s=Math.min(1,k*6)*(k>2.3?Math.max(0,(2.6-k)/.3):1);const[x,y]=toScreen(a.x,a.y-48);const bx=x,by=y-14*Math.max(.8,z)-Math.sin(k*3)*2;c.save();c.translate(bx,by);c.scale(s,s);rr(c,-17,-16,34,30,12);c.fillStyle='#fff';c.fill();c.strokeStyle=INK;c.lineWidth=2;c.stroke();poly(c,[[-4,13],[4,13],[0,20]]);c.fill();c.stroke();c.fillStyle='#fff';c.fillRect(-5,10,10,4);c.font='17px system-ui';c.fillText(a.emote.ch,0,0);c.restore()}
 // minimap
 mctx.drawImage(mmBase,0,0);const k=440/W;mctx.fillStyle='#fff';for(const a of npcs)if(a.state!=='inside'){circ(mctx,a.x*k,a.y*k,3);mctx.fill()}circ(mctx,player.x*k,player.y*k,6);mctx.fillStyle='#6c72f5';mctx.fill();mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.stroke();mctx.strokeStyle='rgba(255,255,255,.95)';mctx.lineWidth=3;mctx.strokeRect(vx0*k,vy0*k,vw*k,vh*k);
 $('onl').textContent=onlineBase+npcs.length+1;
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
setTimeout(()=>{const h=$('help');h.style.transition='opacity .6s';h.style.opacity=0;setTimeout(()=>h.remove(),700)},9000);
setTimeout(()=>toast('Selamat datang di Fajar Campus! Ikuti tanda ! untuk misi harian'),500);
})();
</script>
