<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Semua tugas kelas</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5b4ee0}a:hover{color:#3f33b8}
button{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #5b4ee0;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; min-height: 900px; box-sizing: border-box; padding: 48px 24px; display: flex; justify-content: center; align-items: flex-start; background: #a6db8e; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1d2140; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 210px; height: 56px; background: #f2e1ba"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 640px; height: 56px; background: #f2e1ba"></div>
  <div aria-hidden="true" style="position: absolute; left: 22%; top: 0; bottom: 0; width: 56px; background: #f2e1ba"></div>
  <div aria-hidden="true" style="position: absolute; right: 24%; top: 0; bottom: 0; width: 56px; background: #f2e1ba"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(29, 33, 64, 0.58)"></div>

  <section aria-labelledby="all-title" style="position: relative; width: 100%; max-width: 1160px; min-height: 790px; background: #ffffff; border-radius: 24px; box-shadow: 0 24px 60px rgba(17, 19, 45, 0.35); display: flex; flex-direction: column; overflow: hidden">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 22px 28px; border-bottom: 1px solid #e9ebf3">
      <div style="flex: 999 1 300px; min-width: 0">
        <h1 id="all-title" style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800">Tugas kelas</h1>
        <p style="margin: 4px 0 0; font-size: 14px; font-weight: 600; color: #5d6280">Kelas 1A · 2026/2027 · 2 aktif, 1 selesai, 1 dibatalkan</p>
      </div>
      <label style="flex: 1 1 260px; max-width: 320px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #e9ebf3; color: #5d6280">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari tugas</span>
        <input type="search" placeholder="Cari tugas" style="flex: 1; min-width: 0; border: 0; outline: none; font: 600 16px 'Plus Jakarta Sans', system-ui, sans-serif; color: #1d2140; background: transparent">
      </label>
      <button type="button" aria-label="Tutup" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #e9ebf3; background: #ffffff; color: #1d2140; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </header>

    <div style="padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 20px">
      <div role="tablist" aria-label="Saring tugas" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
          <button type="button" role="tab" aria-selected="{{f.sel}}" onClick="{{f.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; {{f.style}}">{{f.label}} <span style="opacity: 0.75">{{f.count}}</span></button>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px">
        <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
          <a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 20px; border: 1px solid #e9ebf3; background: #ffffff; color: #1d2140; text-decoration: none; box-shadow: 0 3px 0 #e9ebf3; {{t.cardVar}}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; {{t.subjVar}}">{{t.subject}}</span>
              <span style="font-size: 13px; font-weight: 700; {{t.stateVar}}">{{t.state}}</span>
            </div>
            <div>
              <div style="font-size: 20px; font-weight: 800; line-height: 1.25">{{t.title}}</div>
              <div style="margin-top: 4px; font-size: 14px; font-weight: 600; color: #5d6280">{{t.steps}} langkah · {{t.kinds}}</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span style="color: #5d6280">Progres</span><span>{{t.doneText}}</span></div>
              <div style="height: 8px; border-radius: 999px; background: #e9ebf3; overflow: hidden"><div style="height: 100%; border-radius: 999px; {{t.barVar}}"></div></div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid #e9ebf3">
              <span style="font-size: 13px; font-weight: 700; {{t.dueVar}}">{{t.due}}</span>
              <span style="display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 800; {{t.ctaVar}}">{{t.cta}}</span>
            </div>
          </a>
        </sc-for>
      </div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; padding: 40px; border-radius: 18px; background: #f7f7fc; text-align: center; font-size: 15px; font-weight: 600; color: #5d6280">Tidak ada tugas di filter ini.</p>
      </sc-if>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'semua' };
  }
  renderVals() {
    var self = this;
    var T = [
      { title: 'Pecahan Sederhana', subject: 'Matematika', fg: '#1f4fb8', bg: '#e6eeff', bar: '#2f6fe4', steps: 4, done: 1, kinds: 'materi, video, berkas, kuis', due: 'Tanpa tenggat', st: 'aktif' },
      { title: 'Sistem Pencernaan', subject: 'IPA', fg: '#0b6b62', bg: '#e0f5f2', bar: '#0f9488', steps: 3, done: 0, kinds: 'materi, video, kuis', due: 'Tenggat 28 Nov 2026, 23.59 WIB', soon: true, st: 'aktif' },
      { title: 'Teks Deskripsi', subject: 'Bahasa Indonesia', fg: '#9d1d52', bg: '#fde6ef', bar: '#d0457f', steps: 3, done: 3, kinds: 'materi, berkas, kuis', due: 'Selesai 20 Nov 2026', st: 'selesai' },
      { title: 'Kerajaan Majapahit', subject: 'Sejarah', fg: '#8a4310', bg: '#fdeedd', bar: '#c2691f', steps: 2, done: 1, kinds: 'materi, kuis', due: 'Riwayat tetap tersedia', st: 'batal' }
    ];
    var F = [['semua', 'Semua'], ['aktif', 'Belum selesai'], ['selesai', 'Selesai'], ['batal', 'Dibatalkan']];
    var cur = this.state.filter;
    var filters = F.map(function (f) {
      var n = f[0] === 'semua' ? T.length : T.filter(function (t) { return t.st === f[0]; }).length;
      var sel = cur === f[0];
      return { label: f[1], count: n, sel: sel ? 'true' : 'false',
        style: sel ? 'border: 1px solid #5b4ee0; background: #5b4ee0; color: #ffffff;' : 'border: 1px solid #e9ebf3; background: #ffffff; color: #1d2140;',
        pick: function () { self.setState({ filter: f[0] }); } };
    });
    var list = T.filter(function (t) { return cur === 'semua' || t.st === cur; }).map(function (t) {
      var pct = Math.round(t.done / t.steps * 100);
      var isBatal = t.st === 'batal', isDone = t.st === 'selesai';
      return {
        title: t.title, subject: t.subject, steps: t.steps, kinds: t.kinds, due: t.due,
        doneText: t.done + ' dari ' + t.steps,
        state: isBatal ? 'Dibatalkan' : isDone ? 'Selesai' : t.done ? 'Sedang dikerjakan' : 'Belum dimulai',
        stateVar: isBatal ? 'color: #8a8fa8;' : isDone ? 'color: #15703d;' : 'color: #4a3dd1;',
        subjVar: 'background: ' + t.bg + '; color: ' + t.fg + ';',
        barVar: 'width: ' + pct + '%; background: ' + (isBatal ? '#b9bccd' : t.bar) + ';',
        dueVar: t.soon ? 'color: #9a3d07;' : 'color: #5d6280;',
        cardVar: isBatal ? 'opacity: 0.7;' : '',
        cta: isBatal || isDone ? 'Lihat' : t.done ? 'Lanjutkan' : 'Mulai',
        ctaVar: isBatal || isDone ? 'border: 1px solid #e9ebf3; color: #1d2140;' : 'background: #5b4ee0; color: #ffffff;'
      };
    });
    return { filters: filters, tasks: list, empty: list.length === 0 };
  }
}
</script>
</body>
</html>
