# Local development only. The Go server runs on the host via `make run`.
name: kelasverse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kelasverse
      POSTGRES_PASSWORD: kelasverse
      POSTGRES_DB: kelasverse
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelasverse -d kelasverse"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI

  # Voice (slice 9). --dev uses the fixed key pair devkey/secret; never in production.
  livekit:
    image: livekit/livekit-server:v1.9
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "${LIVEKIT_PORT:-7880}:7880" # signal (ws) + RoomService (http)
      - "7881:7881" # WebRTC over TCP
      - "7882:7882/udp" # WebRTC media (single muxed UDP port in --dev)

volumes:
  pgdata:
