# Local development only. The Go server runs on the host via `make run`.
name: kelasverse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kelasverse
      POSTGRES_PASSWORD: kelasverse
      POSTGRES_DB: kelasverse
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelasverse -d kelasverse"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI

volumes:
  pgdata:
