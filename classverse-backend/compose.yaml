# Local development only. The Go server runs on the host via `make run`.
name: kelasverse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kelasverse
      POSTGRES_PASSWORD: kelasverse
      POSTGRES_DB: kelasverse
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelasverse -d kelasverse"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI

  # Voice (slice 9). --dev uses the fixed key pair devkey/secret; never in production.
  livekit:
    image: livekit/livekit-server:v1.9.12
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880" # private signaling/API; browsers use Go /voice
      - "7881:7881" # WebRTC over TCP
      - "7882:7882/udp" # WebRTC media (single muxed UDP port in --dev)

  # Optional private learning storage. Start with: make storage-up
  storage:
    profiles: [storage]
    image: quay.io/minio/aistor/minio@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
    command: minio server /mnt/data --license /minio.license --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/storage_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/storage_root_password
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9100}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9101}:9001"
    volumes:
      - storage_data:/mnt/data
      - type: bind
        source: ${STORAGE_LICENSE_FILE:-../.config/minio.license}
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - storage_root_user
      - storage_root_password
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  storage_root_user:
    file: ../.config/storage-root-user
  storage_root_password:
    file: ../.config/storage-root-password

volumes:
  pgdata:
  storage_data:
