openapi: 3.0.3
info:
  title: Kelasverse API
  version: 0.2.0
  description: |
    REST API Kelasverse. Semua path di bawah `/api`, JSON `snake_case`, waktu ISO 8601 UTC.
    Lihat docs/design.md bagian API contract.
servers:
  - url: /
security:
  - bearer: []

paths:
  /api/auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202": { description: "OTP dikirim (jawaban sama walau email sudah terdaftar)" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/AccessToken" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/resend-otp:
    post:
      operationId: resendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: "OTP dikirim jika akun belum terverifikasi" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AccessToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/refresh:
    post:
      operationId: refresh
      description: Memakai cookie `kv_refresh`; header Origin wajib sama dengan FRONTEND_URL.
      security: []
      responses:
        "200": { $ref: "#/components/responses/AccessToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/logout:
    post:
      operationId: logout
      security: []
      responses:
        "204": { description: "Family refresh token dicabut" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/google/start:
    get:
      operationId: googleStart
      security: []
      responses:
        "302": { description: "Redirect ke Google" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/auth/google/callback:
    get:
      operationId: googleCallback
      security: []
      responses:
        "302": { description: "Redirect ke FRONTEND_URL/auth/callback (atau ?error=<code>)" }

  /api/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Profil dan organisasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Profil setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/maps/{map_key}:
    get:
      operationId: getMap
      description: File peta Tiled (.tmj). Publik; ETag untuk revalidasi.
      security: []
      parameters:
        - { name: map_key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Peta Tiled JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "304": { description: "Tidak berubah (If-None-Match)" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs:
    post:
      operationId: createOrg
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrgRequest" }
      responses:
        "201":
          description: Organisasi dibuat; pembuat jadi admin; peta sekolah dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: getOrg
      responses:
        "200":
          description: Detail organisasi dan role pemanggil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/invites:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listInvites
      description: Undangan aktif (belum kedaluwarsa, dicabut, atau habis), terbaru dulu.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Daftar undangan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Undangan dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/invites/{invite_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: invite_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeInvite
      responses:
        "204": { description: "Undangan dicabut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/invites/{code}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewInvite
      responses:
        "200":
          description: Nama organisasi dan role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/InviteExpired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/invites/{code}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: acceptInvite
      responses:
        "200":
          description: Bergabung ke organisasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/InviteExpired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/orgs/{org_id}/rooms:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listRooms
      description: Ruang non-arsip selain peta sekolah, terbaru dulu. Ruang Guru hanya untuk pengajar/admin.
      parameters:
        - { name: building, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Daftar ruang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
      responses:
        "201":
          description: Ruang dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rooms/{room_id}:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRoom
      responses:
        "200":
          description: Detail ruang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateRoom
      description: Hanya nama dan jadwal. `scheduled_at` null membuka ruang sekarang.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoomRequest" }
      responses:
        "200":
          description: Ruang diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveRoom
      responses:
        "204": { description: "Ruang diarsipkan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/rooms/{room_id}/voice-token:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createVoiceToken
      description: >
        Token LiveKit (2 menit) untuk voice ruang kelas/taman. Hanya untuk user yang sedang terhubung lewat
        WebSocket di ruang itu. Token zona dan broadcast terpisah, admission dirotasi setelah perpindahan/moderasi;
        publish hanya mikrofon, ditolak selama dibisukan pengajar (slice 9).
      responses:
        "409":
          description: voice_pending; pemutusan admission sebelumnya belum terkonfirmasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "200":
          description: Token voice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/VoiceUnavailable" }

  /api/reports:
    post:
      operationId: createReport
      description: >-
        Peserta melaporkan pengguna atau pesan. Jika message_id diisi, pengirim pesan menjadi target
        dan ruang diturunkan dari pesan; isi pesan tidak disalin dari client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
      responses:
        "201":
          description: Laporan dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/reports:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listReports
      description: Pengajar dan admin. Terbaru dulu.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReportStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Daftar laporan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reports/{report_id}:
    parameters:
      - { name: report_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: reviewReport
      description: Pengajar dan admin menandai laporan ditinjau atau diabaikan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewReportRequest" }
      responses:
        "200":
          description: Laporan diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/moderation-log:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listModerationLog
      description: Hanya admin. Aksi mute, kick, izinkan, kunci; terbaru dulu.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Log moderasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationLog" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/uploads:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    post:
      operationId: startUpload
      description: |
        Pengajar/admin. Memesan kuota sekali untuk seluruh file. `id` dibuat klien dan disimpan sebelum
        request agar retry setelah respons hilang tidak memesan kuota dua kali (POST ulang dengan isi sama → 201
        dengan status yang sama). Isi dicek dari byte file (PDF, MP3, M4A), bukan ekstensi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartUploadRequest" }
      responses:
        "201":
          description: Sesi upload (baru atau yang sudah ada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadProgress" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/orgs/{org_id}/uploads/{file_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    get:
      operationId: getUpload
      description: Chunk yang sudah tersimpan menurut storage; klien hanya mengirim nomor yang belum ada.
      responses:
        "200":
          description: Progres upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadProgress" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: cancelUpload
      description: Batalkan upload yang belum siap; chunk dihapus dan kuota dilepas. Idempoten.
      responses:
        "204": { description: Dibatalkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/uploads/{file_id}/parts/{part}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
      - { name: part, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 10 } }
    put:
      operationId: putUploadPart
      description: Chunk ke-n, tepat `chunk_size` byte kecuali chunk terakhir. Mengirim ulang chunk yang sama aman.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Chunk tersimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/orgs/{org_id}/uploads/{file_id}/complete:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    post:
      operationId: completeUpload
      description: |
        Gabungkan chunk, cek SHA-256 dan format. Berhasil → file `ready` dan tampil di daftar. Gagal format →
        400 (`validation_failed` atau `pdf_encrypted`), file dibuang dan kuota dilepas. Idempoten.
      responses:
        "200":
          description: File siap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadProgress" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/files:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listFiles
      description: File siap milik sekolah (maks 200, terbaru dulu), posisi baca pemanggil, dan pemakaian kuota.
      responses:
        "200":
          description: Daftar file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    delete:
      operationId: deleteFile
      description: Pengunggah atau admin. Kuota dilepas setelah objek terhapus. Idempoten.
      responses:
        "204": { description: Dihapus }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    get:
      operationId: getFileContent
      description: |
        Isi file lewat origin aplikasi dengan Bearer token; membership dicek ulang setiap request termasuk tiap
        Range. Satu rentang `bytes=` saja. Storage tidak pernah terbuka ke browser.
      parameters:
        - { name: Range, in: header, schema: { type: string, example: "bytes=0-65535" } }
      responses:
        "200":
          description: Seluruh file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/mp4: { schema: { type: string, format: binary } }
        "206": { description: Sebagian file; lihat Content-Range }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: "range_not_satisfiable; Content-Range: bytes */size" }
  /api/orgs/{org_id}/files/{file_id}/position:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    put:
      operationId: saveFilePosition
      description: Halaman PDF (mulai 1) atau detik audio terakhir milik pemanggil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        "204": { description: Tersimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/library/books:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listBooks
      description: |
        Katalog urut judul. Peserta hanya melihat buku terbit; `drafts=true` menyertakan draf untuk
        pengajar/admin (diabaikan untuk peserta). Arsip tidak pernah tampil. `position` = posisi baca pemanggil.
      parameters:
        - { name: shelf, in: query, schema: { $ref: "#/components/schemas/Shelf" } }
        - { name: q, in: query, description: "Cari judul/penulis, teks literal", schema: { type: string, maxLength: 100 } }
        - { name: drafts, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Satu halaman katalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createBook
      description: Pengajar/admin. E-book memakai file PDF siap milik sekolah, audio memakai MP3/M4A, buku fisik tanpa file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "201":
          description: Buku dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/library/books/{book_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: book_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateBook
      description: Pengajar/admin. Mengganti semua field; `published=false` mengembalikan ke draf.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "200":
          description: Buku diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveBook
      description: Pengajar/admin. Arsipkan; file tidak ikut terhapus.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/library/books/{book_id}/loans:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: book_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: borrowBook
      description: |
        Anggota meminjam satu eksemplar buku fisik terbit selama 14 hari. Maksimal 5 pinjaman aktif.
        Diulang saat pinjaman masih aktif mengembalikan pinjaman yang sama (tidak membuat duplikat).
      responses:
        "200":
          description: Pinjaman aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyLoan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`no_copies`, `loan_limit`, atau `not_loanable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orgs/{org_id}/library/loans:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listMyLoans
      description: Pinjamanku — pinjaman aktif pemanggil, jatuh tempo terdekat dulu.
      responses:
        "200":
          description: Pinjaman aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/library/loans/{loan_id}/return:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: loan_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: returnLoan
      description: Peminjam mengembalikan pinjamannya sendiri. Diulang aman.
      responses:
        "204": { description: Dikembalikan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listModules
      description: |
        Modul (jalur belajar) beserta langkah aktif berurutan. Peserta hanya melihat modul terbit; `drafts=true`
        menyertakan draf untuk pengajar/admin. Arsip tidak pernah tampil. Maksimal 100 modul.
      parameters:
        - { name: building_key, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: drafts, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Daftar modul
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createModule
      description: Pengajar/admin. Gedung khusus staf (Ruang Guru) ditolak.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleInput" }
      responses:
        "201":
          description: Modul dibuat (tanpa langkah)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/modules/{module_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateModule
      description: Pengajar/admin. Mengganti field modul; modul terbit diedit langsung.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleInput" }
      responses:
        "200":
          description: Modul diperbarui (tanpa langkah)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveModule
      description: Pengajar/admin. Arsipkan modul beserta langkahnya; file tidak ikut terhapus.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/steps:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addModuleStep
      description: Pengajar/admin. Langkah baru ditaruh paling akhir; maksimal 50 langkah aktif.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepInput" }
      responses:
        "201":
          description: Langkah dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleStep" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/steps/{step_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: step_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateModuleStep
      description: Pengajar/admin. Mengganti isi langkah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepInput" }
      responses:
        "200":
          description: Langkah diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleStep" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveModuleStep
      description: Pengajar/admin. Langkah tidak pernah dihapus permanen agar progres (M2) tetap merujuk data nyata.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/order:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: reorderModuleSteps
      description: Pengajar/admin. `step_ids` wajib memuat semua langkah aktif tepat sekali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_ids]
              properties:
                step_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Urutan disimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/modules/resume:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: resumeModule
      description: Modul terbit terakhir yang dikerjakan dan masih punya langkah aktif belum selesai; null jika tidak ada.
      responses:
        "200":
          description: Lanjutkan belajar
          content:
            application/json:
              schema:
                type: object
                required: [resume]
                properties:
                  resume:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/ModuleResume" }]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/steps/{step_id}/done:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: step_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: completeModuleStep
      description: Tandai langkah selesai untuk pemanggil; idempoten. Langkah bebas diselesaikan tanpa urutan wajib.
      responses:
        "204": { description: Selesai }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: uncompleteModuleStep
      description: Batalkan tanda selesai milik pemanggil; idempoten.
      responses:
        "204": { description: Tanda selesai dibatalkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgID:
      name: org_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileID:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteCode:
      name: code
      in: path
      required: true
      description: Tidak peka huruf besar; `-` dan spasi diabaikan.
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: validation_failed, detail di error.fields
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: forbidden atau profile_incomplete
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InviteExpired:
      description: invite_expired (kedaluwarsa, dicabut, atau kuota habis)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    VoiceUnavailable:
      description: voice_unavailable (LiveKit tidak dikonfigurasi)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: rate_limited; lihat header Retry-After
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AccessToken:
      description: Access token; cookie kv_refresh disetel
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AccessTokenResponse" }

  schemas:
    Level:
      type: string
      enum: [SD, SMP, SMA, Umum]
    ModuleInput:
      type: object
      required: [building_key, level, title, description, published]
      properties:
        building_key: { type: string, description: "Kunci gedung di peta kampus" }
        level: { $ref: "#/components/schemas/Level" }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        published: { type: boolean }
    Module:
      allOf:
        - $ref: "#/components/schemas/ModuleInput"
        - type: object
          required: [id, updated_at, steps]
          properties:
            id: { type: string, format: uuid }
            updated_at: { type: string, format: date-time }
            steps: { type: array, items: { $ref: "#/components/schemas/ModuleStep" } }
    ModuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Module" } }
    StepKind:
      type: string
      enum: [materi, berkas, video]
    StepInput:
      type: object
      required: [kind, title, minutes]
      properties:
        kind: { $ref: "#/components/schemas/StepKind" }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 5000, description: "Teks materi (wajib untuk `materi`, catatan opsional lainnya). Ditampilkan sebagai teks biasa." }
        file_id: { type: string, format: uuid, nullable: true, description: "Wajib untuk `berkas`: PDF/audio siap milik sekolah" }
        video_id: { type: string, description: "Wajib untuk `video`: ID atau tautan YouTube (https)" }
        minutes: { type: integer, minimum: 1, maximum: 240 }
    ModuleStep:
      type: object
      required: [id, kind, title, body, file_id, file_kind, video_id, minutes, reader_position, done]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/StepKind" }
        title: { type: string }
        body: { type: string }
        file_id: { type: string, format: uuid, nullable: true }
        file_kind: { type: string, enum: [pdf, audio], nullable: true, description: "Jenis file langkah `berkas` (hanya di daftar modul)" }
        video_id: { type: string, nullable: true, description: "ID video YouTube 11 karakter" }
        minutes: { type: integer }
        reader_position: { type: integer, description: "Posisi baca pemanggil untuk file langkah `berkas`" }
        done: { type: boolean, description: "Langkah sudah ditandai selesai oleh pemanggil" }
    ModuleResume:
      type: object
      required: [module_id, building_key, level, title, done, total, next_title]
      properties:
        module_id: { type: string, format: uuid }
        building_key: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        title: { type: string }
        done: { type: integer }
        total: { type: integer }
        next_title: { type: string }
    Shelf:
      type: string
      enum: [dongeng, novel, komik, sains, matematika, sejarah, inggris, referensi]
    BookInput:
      type: object
      required: [title, author, shelf, level, format, copies, cover, published]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        author: { type: string, minLength: 1, maxLength: 120 }
        shelf: { $ref: "#/components/schemas/Shelf" }
        level: { type: string, enum: [SD, SMP, SMA, Umum] }
        format: { type: string, enum: [buku, ebook, audio] }
        copies: { type: integer, minimum: 0, maximum: 999, description: "Eksemplar fisik; selalu 0 untuk ebook/audio" }
        file_id: { type: string, format: uuid, nullable: true }
        cover: { type: string, enum: [ipa, matematika, sejarah, bahasa, kreatif, diskusi, kelas, arena] }
        published: { type: boolean }
    Book:
      allOf:
        - $ref: "#/components/schemas/BookInput"
        - type: object
          required: [id, sample, position, updated_at, available, my_loan]
          properties:
            id: { type: string, format: uuid }
            sample: { type: boolean, description: "Buku contoh dari seed, boleh dihapus" }
            position: { type: integer }
            updated_at: { type: string, format: date-time }
            available: { type: integer, description: "Buku fisik: eksemplar yang tidak sedang dipinjam" }
            my_loan:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/MyLoan" }]
    MyLoan:
      type: object
      required: [id, due_at]
      properties:
        id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }
    Loan:
      type: object
      required: [id, book_id, title, author, cover, borrowed_at, due_at, returned_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        cover: { type: string }
        borrowed_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time, nullable: true }
    LoanList:
      type: object
      required: [items, max_active]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Loan" } }
        max_active: { type: integer }
    BookList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Book" } }
        next_cursor: { type: string, nullable: true }
    StartUploadRequest:
      type: object
      required: [id, name, size, kind, sha256]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, format: int64, minimum: 1, maximum: 50000000 }
        kind: { type: string, enum: [pdf, audio] }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    UploadProgress:
      type: object
      required: [id, size, chunk_size, parts, state, expires_at]
      properties:
        id: { type: string, format: uuid }
        size: { type: integer, format: int64 }
        chunk_size: { type: integer, format: int64, description: "5242880 (5 MiB)" }
        parts: { type: array, items: { type: integer } }
        state: { type: string, enum: [uploading, assembled, canceled] }
        expires_at: { type: string, format: date-time }
    FileItem:
      type: object
      required: [id, name, kind, content_type, size, uploaded_by, created_at, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [pdf, audio] }
        content_type: { type: string, enum: [application/pdf, audio/mpeg, audio/mp4] }
        size: { type: integer, format: int64 }
        uploaded_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        position: { type: integer }
    FileList:
      type: object
      required: [items, used_bytes, quota_bytes]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FileItem" } }
        used_bytes: { type: integer, format: int64 }
        quota_bytes: { type: integer, format: int64 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }

    AccessTokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, display_name, birth_date]
      properties:
        email: { type: string }
        password: { type: string }
        display_name: { type: string }
        birth_date: { type: string, format: date }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string }
        code: { type: string }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    Role:
      type: string
      enum: [admin, teacher, participant]
    InviteRole:
      type: string
      enum: [teacher, participant]

    OrgSummary:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Me:
      type: object
      required: [id, email, display_name, birth_date, avatar_key, needs_profile, orgs]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        birth_date: { type: string, format: date, nullable: true }
        avatar_key: { type: string }
        needs_profile: { type: boolean }
        orgs:
          type: array
          items: { $ref: "#/components/schemas/OrgSummary" }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 3, maxLength: 24, description: "NFC, trimmed, repeated spaces collapsed; prohibited words rejected" }
        birth_date: { type: string, format: date }
        avatar_key:
          type: string
          description: "Idle avatar palette: look-<skin 0..5>-<hair 0..4>-<shirt 0..9>. Legacy keys remain valid."
          pattern: "^(?:look-[0-5]-[0-4]-[0-9]|default|(?:round|cap|glasses|headset|bun|beret)-(?:nila|mangga)|sporty-(?:runner|cap|headphones|varsity|ponytail|hoodie|glasses)-(?:nila|mangga|zamrud|laut|koral|grafit))$"

    CreateOrgRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,46}[a-z0-9])$" }
        logo_url: { type: string, nullable: true, description: "URL https opsional" }
    Organization:
      type: object
      required: [id, name, slug, logo_url, role, campus_room_id, created_at]
      properties:
        id: { type: string, format: uuid }
        campus_room_id: { type: string, format: uuid, description: "Room peta sekolah; dibuka lewat /ws/rooms/{campus_room_id}" }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, nullable: true }
