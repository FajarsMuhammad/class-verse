        map_key: { $ref: "#/components/schemas/RoomMap" }
        building_key: { type: string }
        capacity: { type: integer }
        scheduled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        people: { type: integer, description: "Terhubung + grace reconnect + reservasi travel" }
        live: { type: boolean, description: "Sesi terbuka dengan people > 0" }
        all_chat_enabled: { type: boolean }
    RoomList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Room" }
