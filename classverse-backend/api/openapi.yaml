openapi: 3.0.3
info:
  title: Kelasverse API
  version: 0.2.0
  description: |
    REST API Kelasverse. Semua path di bawah `/api`, JSON `snake_case`, waktu ISO 8601 UTC.
    Lihat docs/design.md bagian API contract.
servers:
  - url: /
security:
  - bearer: []

paths:
  /api/auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202": { description: "OTP dikirim (jawaban sama walau email sudah terdaftar)" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/AccessToken" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/resend-otp:
    post:
      operationId: resendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: "OTP dikirim jika akun belum terverifikasi" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AccessToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/refresh:
    post:
      operationId: refresh
      description: Memakai cookie `kv_refresh`; header Origin wajib sama dengan FRONTEND_URL.
      security: []
      responses:
        "200": { $ref: "#/components/responses/AccessToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/logout:
    post:
      operationId: logout
      security: []
      responses:
        "204": { description: "Family refresh token dicabut" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/google/start:
    get:
      operationId: googleStart
      security: []
      responses:
        "302": { description: "Redirect ke Google" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/auth/google/callback:
    get:
      operationId: googleCallback
      security: []
      responses:
        "302": { description: "Redirect ke FRONTEND_URL/auth/callback (atau ?error=<code>)" }

  /api/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Profil dan organisasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Profil setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/maps/{map_key}:
    get:
      operationId: getMap
      description: File peta Tiled (.tmj). Publik; ETag untuk revalidasi.
      security: []
      parameters:
        - { name: map_key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Peta Tiled JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "304": { description: "Tidak berubah (If-None-Match)" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs:
    post:
      operationId: createOrg
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrgRequest" }
      responses:
        "201":
          description: Organisasi dibuat; pembuat jadi admin; peta sekolah dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: getOrg
      responses:
        "200":
          description: Detail organisasi dan role pemanggil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/invites:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listInvites
      description: Undangan aktif (belum kedaluwarsa, dicabut, atau habis), terbaru dulu.
      parameters:
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Daftar undangan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Undangan dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/invites/{invite_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: invite_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeInvite
      responses:
        "204": { description: "Undangan dicabut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/invites/{code}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewInvite
      responses:
        "200":
          description: Nama organisasi dan role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/InviteExpired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/invites/{code}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: acceptInvite
      responses:
        "200":
          description: Bergabung ke organisasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/InviteExpired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/orgs/{org_id}/rooms:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listRooms
      description: Ruang non-arsip selain peta sekolah, terbaru dulu. Ruang Guru hanya untuk pengajar/admin.
      parameters:
        - { name: building, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Daftar ruang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
      responses:
        "201":
          description: Ruang dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rooms/{room_id}:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRoom
      responses:
        "200":
          description: Detail ruang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateRoom
      description: Hanya nama dan jadwal. `scheduled_at` null membuka ruang sekarang.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoomRequest" }
      responses:
        "200":
          description: Ruang diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveRoom
      responses:
        "204": { description: "Ruang diarsipkan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/rooms/{room_id}/voice-token:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createVoiceToken
      description: >
        Token LiveKit (2 menit) untuk voice ruang kelas/taman. Hanya untuk user yang sedang terhubung lewat
        WebSocket di ruang itu. Token zona dan broadcast terpisah, admission dirotasi setelah perpindahan/moderasi;
        publish hanya mikrofon, ditolak selama dibisukan pengajar (slice 9).
      responses:
        "409":
          description: voice_pending; pemutusan admission sebelumnya belum terkonfirmasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "200":
          description: Token voice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/VoiceUnavailable" }

  /api/rooms/{room_id}/guest-links:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGuestLinks
      description: Link tamu aktif ruang ini (G1). Guru dan admin sekolah ruang.
      responses:
        "200":
          description: Link aktif, terbaru dulu (maks 20)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GuestLink" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createGuestLink
      description: Buat link tamu untuk satu ruang (bukan kampus). Berlaku maks 24 jam, maks 40 tamu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGuestLinkRequest" }
      responses:
        "201":
          description: Link dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestLink" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rooms/{room_id}/guest-links/{link_id}:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: link_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeGuestLink
      description: Cabut link; tamu yang sudah masuk lewat link ini langsung diputus.
      responses:
        "204": { description: Dicabut }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rooms/{room_id}/guest-requests:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGuestRequests
      description: Tamu yang menunggu persetujuan, terlama dulu (maks 50).
      responses:
        "200":
          description: Antrean tamu
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GuestRequest" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rooms/{room_id}/guest-requests/{request_id}:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideGuestRequest
      description: Izinkan atau tolak tamu. Permintaan yang sudah diputuskan menjawab 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
      responses:
        "200":
          description: Keputusan tersimpan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestRequest" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/guest/links/{code}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewGuestLink
      security: []
      description: Pratinjau link tamu tanpa akun. Dibatasi per IP.
      responses:
        "200":
          description: Nama sekolah dan ruang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestLinkPreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/InviteExpired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/guest/links/{code}/requests:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: requestGuestAccess
      security: []
      description: >-
        Minta masuk sebagai tamu dengan nama. Membuat identitas tamu (tanpa akun) dan mengembalikan token tamu
        berumur pendek. Token ini hanya diterima endpoint /api/guest, WebSocket ruang tujuan, dan token suaranya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, request_key]
              properties:
                request_key: { type: string, format: uuid, description: "Secret UUID v4 retry key. Keep out of logs and URLs; same link/key resumes unchanged request." }
                display_name: { type: string, minLength: 3, maxLength: 24 }
      responses:
        "201":
          description: Permintaan dibuat, status pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/InviteExpired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/guest/me:
    get:
      operationId: getGuestStatus
      description: >-
        Status permintaan tamu (token tamu). Selalu mengembalikan token tamu baru, jadi polling
        sekaligus memperpanjang sesi selama link aktif.
      responses:
        "200":
          description: Status tamu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/InviteExpired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/guest/rooms/{room_id}/voice-token:
    parameters:
      - { name: room_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createGuestVoiceToken
      description: Sama dengan createVoiceToken, untuk token tamu di ruang tujuannya.
      responses:
        "200":
          description: Token voice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: voice_pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503": { $ref: "#/components/responses/VoiceUnavailable" }

  /api/reports:
    post:
      operationId: createReport
      description: >-
        Peserta melaporkan pengguna atau pesan. Jika message_id diisi, pengirim pesan menjadi target
        dan ruang diturunkan dari pesan; isi pesan tidak disalin dari client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
      responses:
        "201":
          description: Laporan dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/reports:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listReports
      description: Pengajar dan admin. Terbaru dulu.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReportStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Daftar laporan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reports/{report_id}:
    parameters:
      - { name: report_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: reviewReport
      description: Pengajar dan admin menandai laporan ditinjau atau diabaikan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewReportRequest" }
      responses:
        "200":
          description: Laporan diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/moderation-log:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listModerationLog
      description: Hanya admin. Aksi mute, kick, izinkan, kunci; terbaru dulu.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Log moderasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationLog" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/uploads:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    post:
      operationId: startUpload
      description: |
        Pengajar/admin. Memesan kuota sekali untuk seluruh file. `id` dibuat klien dan disimpan sebelum
        request agar retry setelah respons hilang tidak memesan kuota dua kali (POST ulang dengan isi sama → 201
        dengan status yang sama). Isi dicek dari byte file (PDF, MP3, M4A), bukan ekstensi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartUploadRequest" }
      responses:
        "201":
          description: Sesi upload (baru atau yang sudah ada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadProgress" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/orgs/{org_id}/uploads/{file_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    get:
      operationId: getUpload
      description: Chunk yang sudah tersimpan menurut storage; klien hanya mengirim nomor yang belum ada.
      responses:
        "200":
          description: Progres upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadProgress" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: cancelUpload
      description: Batalkan upload yang belum siap; chunk dihapus dan kuota dilepas. Idempoten.
      responses:
        "204": { description: Dibatalkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/uploads/{file_id}/parts/{part}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
      - { name: part, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 10 } }
    put:
      operationId: putUploadPart
      description: Chunk ke-n, tepat `chunk_size` byte kecuali chunk terakhir. Mengirim ulang chunk yang sama aman.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Chunk tersimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/orgs/{org_id}/uploads/{file_id}/complete:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    post:
      operationId: completeUpload
      description: |
        Gabungkan chunk, cek SHA-256 dan format. Berhasil → file `ready` dan tampil di daftar. Gagal format →
        400 (`validation_failed` atau `pdf_encrypted`), file dibuang dan kuota dilepas. Idempoten.
      responses:
        "200":
          description: File siap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadProgress" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/files:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listFiles
      description: File siap milik sekolah (maks 200, terbaru dulu), posisi baca pemanggil, dan pemakaian kuota.
      responses:
        "200":
          description: Daftar file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    delete:
      operationId: deleteFile
      description: Pengunggah atau admin. Kuota dilepas setelah objek terhapus. Idempoten.
      responses:
        "204": { description: Dihapus }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    get:
      operationId: getFileContent
      description: |
        Isi file lewat origin aplikasi dengan Bearer token; membership dicek ulang setiap request termasuk tiap
        Range. Satu rentang `bytes=` saja. Storage tidak pernah terbuka ke browser.
      parameters:
        - { name: Range, in: header, schema: { type: string, example: "bytes=0-65535" } }
      responses:
        "200":
          description: Seluruh file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/mp4: { schema: { type: string, format: binary } }
        "206": { description: Sebagian file; lihat Content-Range }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: "range_not_satisfiable; Content-Range: bytes */size" }
  /api/orgs/{org_id}/files/{file_id}/position:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/FileID"
    put:
      operationId: saveFilePosition
      description: Halaman PDF (mulai 1) atau detik audio terakhir milik pemanggil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        "204": { description: Tersimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/library/books:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listBooks
      description: |
        Katalog urut judul. Peserta hanya melihat buku terbit; `drafts=true` menyertakan draf untuk
        pengajar/admin (diabaikan untuk peserta). Arsip tidak pernah tampil. `position` = posisi baca pemanggil.
      parameters:
        - { name: shelf, in: query, schema: { $ref: "#/components/schemas/Shelf" } }
        - { name: q, in: query, description: "Cari judul/penulis, teks literal", schema: { type: string, maxLength: 100 } }
        - { name: drafts, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Satu halaman katalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createBook
      description: Pengajar/admin. E-book memakai file PDF siap milik sekolah, audio memakai MP3/M4A, buku fisik tanpa file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "201":
          description: Buku dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/library/books/{book_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: book_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateBook
      description: Pengajar/admin. Mengganti semua field; `published=false` mengembalikan ke draf.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "200":
          description: Buku diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveBook
      description: Pengajar/admin. Arsipkan; file tidak ikut terhapus.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/library/books/{book_id}/loans:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: book_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: borrowBook
      description: |
        Anggota meminjam satu eksemplar buku fisik terbit selama 14 hari. Maksimal 5 pinjaman aktif.
        Diulang saat pinjaman masih aktif mengembalikan pinjaman yang sama (tidak membuat duplikat).
      responses:
        "200":
          description: Pinjaman aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyLoan" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`no_copies`, `loan_limit`, atau `not_loanable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orgs/{org_id}/library/loans:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listMyLoans
      description: Pinjamanku — pinjaman aktif pemanggil, jatuh tempo terdekat dulu.
      responses:
        "200":
          description: Pinjaman aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/library/loans/{loan_id}/return:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: loan_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: returnLoan
      description: Peminjam mengembalikan pinjamannya sendiri. Diulang aman.
      responses:
        "204": { description: Dikembalikan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/publish:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - name: module_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: publishModuleRevision
      description: "Staff only. Atomically publish expected draft. Same version retry returns same revision; stale version is draft_conflict. Module binds published quiz revisions only."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftVersionInput" }
      responses:
        "200":
          description: Immutable revision published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/orgs/{org_id}/modules/{module_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - name: module_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listModuleRevisions
      description: "Staff-only read-only revision metadata; no learner answer-key access."
      responses:
        "200":
          description: Published revision history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ContentRevision" } }
  /api/orgs/{org_id}/quizzes/{quiz_id}/publish:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - name: quiz_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: publishQuizRevision
      description: "Staff only. Atomically publish expected draft. Same version retry returns same revision; stale version is draft_conflict. Module binds published quiz revisions only."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftVersionInput" }
      responses:
        "200":
          description: Immutable revision published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/orgs/{org_id}/quizzes/{quiz_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - name: quiz_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listQuizRevisions
      description: "Staff-only read-only revision metadata; no learner answer-key access."
      responses:
        "200":
          description: Published revision history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ContentRevision" } }
  /api/orgs/{org_id}/modules:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listModules
      description: |
        Modul (jalur belajar) beserta langkah aktif berurutan. Peserta hanya melihat modul terbit; `drafts=true`
        menyertakan draf untuk pengajar/admin. Arsip tidak pernah tampil. Maksimal 100 modul.
      parameters:
        - { name: building_key, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: drafts, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Daftar modul
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createModule
      description: Pengajar/admin. Gedung khusus staf (Ruang Guru) ditolak.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleInput" }
      responses:
        "201":
          description: Modul dibuat (tanpa langkah)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/modules/{module_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateModule
      description: Pengajar/admin. Mengganti field modul; modul terbit diedit langsung.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleInput" }
      responses:
        "200":
          description: Modul diperbarui (tanpa langkah)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveModule
      description: Pengajar/admin. Arsipkan modul beserta langkahnya; file tidak ikut terhapus.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/steps:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addModuleStep
      description: Pengajar/admin. Langkah baru ditaruh paling akhir; maksimal 50 langkah aktif.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepInput" }
      responses:
        "201":
          description: Langkah dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleStep" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/steps/{step_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: step_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateModuleStep
      description: Pengajar/admin. Mengganti isi langkah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepInput" }
      responses:
        "200":
          description: Langkah diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleStep" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveModuleStep
      description: Pengajar/admin. Langkah tidak pernah dihapus permanen agar progres (M2) tetap merujuk data nyata.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/order:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: reorderModuleSteps
      description: Pengajar/admin. `step_ids` wajib memuat semua langkah aktif tepat sekali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_ids]
              properties:
                step_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Urutan disimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/modules/resume:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: resumeModule
      description: Modul terbit terakhir yang dikerjakan dan masih punya langkah aktif belum selesai; null jika tidak ada.
      responses:
        "200":
          description: Lanjutkan belajar
          content:
            application/json:
              schema:
                type: object
                required: [resume]
                properties:
                  resume:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/ModuleResume" }]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/modules/{module_id}/steps/{step_id}/done:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: module_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: step_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: completeModuleStep
      description: |
        Tandai langkah selesai untuk pemanggil; idempoten. Langkah bebas diselesaikan tanpa urutan wajib.
        Langkah `kuis` ditolak 409 `quiz_step`: selesai otomatis saat lulus kuisnya.
      responses:
        "204": { description: Selesai }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: uncompleteModuleStep
      description: Batalkan tanda selesai milik pemanggil; idempoten.
      responses:
        "204": { description: Tanda selesai dibatalkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/quizzes:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listQuizzes
      description: |
        Kuis beserta nilai terbaik dan jumlah percobaan selesai milik pemanggil. Peserta hanya melihat kuis terbit dan
        tidak pernah menerima soal/kunci di sini. `drafts=true` untuk pengajar/admin menyertakan draf serta soal
        lengkap dengan kunci (untuk Kelola). Maksimal 100 kuis.
      parameters:
        - { name: building_key, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: drafts, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Daftar kuis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createQuiz
      description: Pengajar/admin. Dibuat sebagai draf; terbitkan setelah ada minimal 1 soal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizInput" }
      responses:
        "201":
          description: Kuis dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/orgs/{org_id}/quizzes/{quiz_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/QuizID"
    put:
      operationId: updateQuiz
      description: Pengajar/admin. Percobaan yang sudah dimulai tetap memakai nilai lulus dan soal saat dimulai.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizInput" }
      responses:
        "200":
          description: Kuis diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveQuiz
      description: Pengajar/admin. Arsipkan kuis; riwayat nilai tetap tersimpan.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/quizzes/{quiz_id}/questions:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/QuizID"
    post:
      operationId: addQuizQuestion
      description: Pengajar/admin. Soal ditaruh paling akhir; maksimal 50 soal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "201":
          description: Soal dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizQuestion" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/quizzes/{quiz_id}/questions/{question_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/QuizID"
      - { name: question_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateQuizQuestion
      description: Pengajar/admin. Percobaan yang sudah dimulai tidak berubah (snapshot).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "200":
          description: Soal diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizQuestion" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteQuizQuestion
      description: Pengajar/admin. Kuis terbit wajib menyisakan minimal 1 soal.
      responses:
        "204": { description: Dihapus }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/quizzes/{quiz_id}/order:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/QuizID"
    put:
      operationId: reorderQuizQuestions
      description: Pengajar/admin. `question_ids` wajib memuat semua soal tepat sekali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_ids]
              properties:
                question_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Urutan disimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/quizzes/{quiz_id}/attempts:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/QuizID"
    post:
      operationId: startQuizAttempt
      parameters:
        - name: assignment_step_id
          in: query
          required: false
          description: Own unlocked assignment quiz step; creates/resumes separate task-context attempt
          schema: { type: string, format: uuid }
      description: |
        Melanjutkan percobaan yang belum selesai, atau memulai percobaan baru dengan snapshot soal saat ini.
        Percobaan tidak dibatasi. Kunci dan penjelasan bernilai null sampai percobaan selesai.
      responses:
        "200":
          description: Percobaan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAttempt" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/quizzes/{quiz_id}/attempts/{attempt_id}/answers/{index}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/QuizID"
      - $ref: "#/components/parameters/AttemptID"
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    put:
      operationId: answerQuizQuestion
      description: Menyimpan atau mengganti pilihan untuk soal ke-`index` (0-based). Diulang aman. Ditolak setelah selesai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: integer, minimum: 0, maximum: 3 }
      responses:
        "204": { description: Jawaban disimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/quizzes/{quiz_id}/attempts/{attempt_id}/finish:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/QuizID"
      - $ref: "#/components/parameters/AttemptID"
    post:
      operationId: finishQuizAttempt
      description: |
        Server menilai sekali (soal kosong dihitung salah; nilai dibulatkan ke bawah). Diulang mengembalikan hasil
        yang sama. Lulus otomatis menyelesaikan langkah modul `kuis` yang menunjuk kuis ini.
      responses:
        "200":
          description: Hasil beserta kunci dan penjelasan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAttempt" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orgs/{org_id}/gradebook:
