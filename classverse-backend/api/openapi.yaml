    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name, map_key, building_key]
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        map_key: { $ref: "#/components/schemas/RoomMap" }
        building_key: { type: string }
        scheduled_at: { type: string, format: date-time, nullable: true }
    UpdateRoomRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        scheduled_at: { type: string, format: date-time, nullable: true }
        all_chat_enabled: { type: boolean, description: Tab chat "Semua" boleh dipakai }
    Room:
      type: object
      required: [id, org_id, name, map_key, building_key, capacity, scheduled_at, created_at, people, live, all_chat_enabled]
