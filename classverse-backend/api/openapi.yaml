        token: { type: string }
        broadcast_token: { type: string }
        identity: { type: string }
        channel: { type: string }
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [target_user_id, reason]
      properties:
        target_user_id: { type: string, format: uuid }
        message_id: { type: integer, format: int64, nullable: true }
        room_id: { type: string, format: uuid, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ReviewReportRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [reviewed, dismissed] }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Report:
      type: object
      required: [id, org_id, room_id, room_name, reporter, target, message_id, message_text, reason, status, reviewed_by, reviewed_at, created_at]
