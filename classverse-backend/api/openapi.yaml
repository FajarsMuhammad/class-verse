                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
    post:
      operationId: issueAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentInput" }
      responses:
        "200":
          description: Issued or identical retry
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
  /api/orgs/{org_id}/assignments/{assignment_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/AssignmentID"
    delete:
      operationId: cancelAssignment
      responses:
        "204": { description: Cancelled; history retained }
  /api/orgs/{org_id}/assignments/{assignment_id}/steps:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/AssignmentID"
    get:
      operationId: listAssignmentSteps
      responses:
        "200":
          description: Own ordered steps; locked body and content references omitted
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AssignmentStep" } }
  /api/orgs/{org_id}/assignments/{assignment_id}/roster:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/AssignmentID"
    get:
      operationId: listAssignmentRoster
      responses:
        "200":
          description: Staff only; frozen recipient progress
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AssignmentRecipient" } }
  /api/orgs/{org_id}/assignments/{assignment_id}/steps/{step_id}/done:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/AssignmentID"
      - { name: step_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: completeAssignmentStep
      description: Ordered monotonic completion; quiz steps require passing contextual attempt, never manual completion
      responses:
        "204": { description: Done or identical retry }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/academic-years:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listAcademicYears
      description: Pengajar/admin. Tahun ajaran sekolah, terbaru dulu; tepat satu aktif bila ada.
      responses:
        "200":
          description: Daftar tahun ajaran
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AcademicYear" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAcademicYear
      description: Admin. Label `YYYY/YYYY+1`, unik per sekolah. Tahun pertama sekolah otomatis aktif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, example: "2026/2027" }
      responses:
        "201":
          description: Tahun ajaran dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicYear" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/academic-years/{year_id}/active:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/YearID"
    put:
      operationId: activateAcademicYear
      description: Admin. Menjadikan tahun ini satu-satunya tahun aktif; tahun lain tetap tersedia.
      responses:
        "204": { description: Diaktifkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/academic-years/{year_id}/classes:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/YearID"
    get:
      operationId: listClasses
      description: Pengajar/admin. Kelas aktif (bukan arsip) beserta jumlah siswa, wali kelas, jumlah guru mapel dan peran pemanggil; kelas yang diajar pemanggil lebih dulu.
      responses:
        "200":
          description: Daftar kelas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SchoolClass" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createClass
      description: Admin. Nama 1–40 karakter, unik (tanpa beda huruf besar) di tahun itu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassInput" }
      responses:
        "201":
          description: Kelas dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolClass" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/academic-years/{year_id}/roster:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/YearID"
    get:
      operationId: listRoster
      description: Pengajar/admin. Satu halaman anggota berperan peserta dengan kelasnya di tahun ini (null = belum ditempatkan).
      parameters:
        - { name: class_id, in: query, schema: { type: string }, description: "UUID kelas, atau `none` = belum punya kelas" }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Cari nama }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
                  total: { type: integer, description: Jumlah sesuai filter }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/academic-years/{year_id}/roster/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/YearID"
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: placeStudent
      description: |
        Admin menempatkan atau memindahkan peserta ke kelas tahun ini dalam satu transaksi (penempatan lama
        ditutup, riwayat tetap). `class_id: null` mengeluarkan dari kelas. Hanya anggota berperan peserta.
        Wali kelas hanya menambah siswa tanpa kelas ke kelasnya (409 `has_class` bila sudah punya kelas) dan
        mengeluarkan siswa kelasnya; selain itu 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_id]
              properties:
                class_id: { type: string, format: uuid, nullable: true }
      responses:
        "204": { description: Disimpan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/academic-years/{year_id}/moves:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/YearID"
    post:
      operationId: moveStudents
      description: |
        Pindah massal 1–50 peserta ke satu kelas (`class_id: null` = keluarkan), satu transaksi; hak sama dengan
        placeStudent. Siswa yang gagal dilaporkan per item (`not_student`, `has_class`), sisanya tetap dipindah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, class_id]
              properties:
                user_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
                class_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Hasil per siswa
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [user_id, error]
                      properties:
                        user_id: { type: string, format: uuid }
                        error: { type: string, nullable: true, enum: [not_student, has_class, null] }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/academic-years/{year_id}/copy:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/YearID"
    post:
      operationId: copyYearClasses
      description: |
        Admin. Menyalin kelas aktif tahun sumber ke tahun ini; nama yang sudah ada dilewati dan dilaporkan.
        `teachers: true` ikut menyalin wali kelas/guru mapel yang masih pengajar sekolah. Siswa tidak ikut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_year_id]
              properties:
                from_year_id: { type: string, format: uuid }
                teachers: { type: boolean, default: false }
      responses:
        "200":
          description: Hasil salin
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped]
                properties:
                  created: { type: integer }
                  skipped: { type: array, items: { type: string }, description: Nama kelas yang sudah ada }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/academic-years/{year_id}/promotions:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/YearID"
    post:
      operationId: promoteStudents
      description: |
        Admin. Naik kelas: siswa aktif tiap kelas sumber (tahun `from_year_id`) ditempatkan ke kelas tujuan di tahun
        ini sesuai pemetaan eksplisit. Siswa yang sudah punya kelas di tahun ini dilewati dan dilaporkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_year_id, mappings]
              properties:
                from_year_id: { type: string, format: uuid }
                mappings:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [from_class_id, to_class_id]
                    properties:
                      from_class_id: { type: string, format: uuid }
                      to_class_id: { type: string, format: uuid }
      responses:
        "200":
          description: Hasil naik kelas
          content:
            application/json:
              schema:
                type: object
                required: [moved, skipped]
                properties:
                  moved: { type: integer }
                  skipped: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/staff:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      operationId: listStaff
      description: Pengajar/admin. Pengajar dan admin sekolah, calon wali kelas/guru mapel.
      responses:
        "200":
          description: Staf
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [user_id, display_name, role]
                      properties:
                        user_id: { type: string, format: uuid }
                        display_name: { type: string }
                        role: { type: string, enum: [teacher, admin] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/classes/{class_id}/teachers:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: class_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listClassTeachers
      description: Pengajar/admin. Wali kelas dan guru mapel aktif.
      responses:
        "200":
          description: Pengajar kelas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ClassTeacher" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/classes/{class_id}/teachers/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: class_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setClassTeacher
      description: |
        Admin. Menjadikan pengajar/admin sekolah wali kelas (menggantikan wali lama) atau guru mapel dengan mapel
        opsional. Satu peran per orang per kelas; riwayat tetap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [homeroom, subject] }
                subject: { type: string, maxLength: 40, description: Hanya untuk guru mapel }
      responses:
        "204": { description: Disimpan }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeClassTeacher
      description: Admin. Mengakhiri peran orang di kelas.
      responses:
        "204": { description: Dilepas }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/orgs/{org_id}/classes/{class_id}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: class_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: renameClass
      description: Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassInput" }
      responses:
        "200":
          description: Kelas diperbarui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolClass" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveClass
      description: Admin. Hanya kelas tanpa siswa aktif (409 `class_not_empty`); pengajar kelas dilepas; riwayat tetap.
      responses:
        "204": { description: Diarsipkan }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/orgs/{org_id}/members/{user_id}/placements:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listPlacements
      description: Pengajar/admin. Riwayat kelas peserta di sekolah ini, semua tahun, terbaru dulu.
      responses:
        "200":
          description: Riwayat
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Placement" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgID:
      name: org_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentID:
      name: assignment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    YearID:
      name: year_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuizID:
      name: quiz_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptID:
      name: attempt_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileID:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteCode:
      name: code
      in: path
      required: true
      description: Tidak peka huruf besar; `-` dan spasi diabaikan.
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: validation_failed, detail di error.fields
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: forbidden atau profile_incomplete
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InviteExpired:
      description: invite_expired (kedaluwarsa, dicabut, atau kuota habis)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    VoiceUnavailable:
      description: voice_unavailable (LiveKit tidak dikonfigurasi)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: rate_limited; lihat header Retry-After
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AccessToken:
      description: Access token; cookie kv_refresh disetel
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AccessTokenResponse" }

  schemas:
    DraftVersionInput:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1, description: "Required for existing resource writes; stale values return draft_conflict (409)" }
    ContentRevision:
      type: object
      required: [id, revision, draft_version, published_at]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer }
        draft_version: { type: integer, format: int64 }
        published_at: { type: string, format: date-time }
    RichContent:
      type: object
      properties:
        type: { type: string }
        text: { type: string }
        attrs: { type: object, additionalProperties: true }
        marks: { type: array, items: { type: object, required: [type], properties: { type: { type: string }, attrs: { type: object, additionalProperties: true } } } }
        content: { type: array, items: { $ref: "#/components/schemas/RichContent" } }
    Level:
      type: string
      enum: [SD, SMP, SMA, Umum]
    ModuleInput:
      type: object
      required: [building_key, level, title, description, published]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1, description: "Required for existing resource writes; stale values return draft_conflict (409)" }
        building_key: { type: string, description: "Kunci gedung di peta kampus" }
        level: { $ref: "#/components/schemas/Level" }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        published: { type: boolean }
    Module:
      allOf:
        - $ref: "#/components/schemas/ModuleInput"
        - type: object
          required: [id, updated_at, steps]
          properties:
            draft_version: { type: integer, format: int64 }
            published_revision_id: { type: string, format: uuid, nullable: true }
            id: { type: string, format: uuid }
            updated_at: { type: string, format: date-time }
            steps: { type: array, items: { $ref: "#/components/schemas/ModuleStep" } }
    ModuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Module" } }
    StepKind:
      type: string
      enum: [materi, berkas, video, kuis]
    StepInput:
      type: object
      required: [kind, title, minutes]
      properties:
        rich_content: { $ref: "#/components/schemas/RichContent" }
        expected_version: { type: integer, format: int64, minimum: 1, description: "Required for existing resource writes; stale values return draft_conflict (409)" }
        kind: { $ref: "#/components/schemas/StepKind" }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 5000, description: "Teks materi (wajib untuk `materi`, catatan opsional lainnya). Ditampilkan sebagai teks biasa." }
        file_id: { type: string, format: uuid, nullable: true, description: "Wajib untuk `berkas`: PDF/audio siap milik sekolah" }
        video_id: { type: string, description: "Wajib untuk `video`: ID atau tautan YouTube (https)" }
        quiz_id: { type: string, format: uuid, nullable: true, description: "Wajib untuk `kuis`: kuis terbit milik sekolah" }
        minutes: { type: integer, minimum: 1, maximum: 240 }
    ModuleStep:
      type: object
      required: [id, kind, title, body, file_id, file_kind, video_id, quiz_id, minutes, reader_position, done]
      properties:
        rich_content: { $ref: "#/components/schemas/RichContent" }
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/StepKind" }
        title: { type: string }
        body: { type: string }
        file_id: { type: string, format: uuid, nullable: true }
        file_kind: { type: string, enum: [pdf, audio], nullable: true, description: "Jenis file langkah `berkas` (hanya di daftar modul)" }
        video_id: { type: string, nullable: true, description: "ID video YouTube 11 karakter" }
        quiz_id: { type: string, format: uuid, nullable: true, description: "Kuis langkah `kuis`; selesai otomatis saat lulus" }
        minutes: { type: integer }
        reader_position: { type: integer, description: "Posisi baca pemanggil untuk file langkah `berkas`" }
        done: { type: boolean, description: "Langkah sudah ditandai selesai oleh pemanggil" }
    ModuleResume:
      type: object
      required: [module_id, building_key, level, title, done, total, next_title]
      properties:
        module_id: { type: string, format: uuid }
        building_key: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        title: { type: string }
        done: { type: integer }
        total: { type: integer }
        next_title: { type: string }
    QuizInput:
      type: object
      required: [building_key, level, title, description, published]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1, description: "Required for existing resource writes; stale values return draft_conflict (409)" }
        building_key: { type: string, description: "Kunci gedung di peta kampus" }
        level: { $ref: "#/components/schemas/Level" }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        pass_score: { type: integer, minimum: 1, maximum: 100, default: 60 }
        published: { type: boolean }
    Quiz:
      type: object
      required: [id, building_key, level, title, description, pass_score, published, updated_at, question_count, best_score, attempts]
      properties:
        draft_version: { type: integer, format: int64 }
        published_revision_id: { type: string, format: uuid, nullable: true }
        id: { type: string, format: uuid }
        building_key: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        title: { type: string }
        description: { type: string }
        pass_score: { type: integer }
        published: { type: boolean }
        updated_at: { type: string, format: date-time }
        question_count: { type: integer }
        best_score: { type: integer, nullable: true, description: "Nilai tertinggi pemanggil; null jika belum pernah selesai" }
        attempts: { type: integer, description: "Jumlah percobaan selesai milik pemanggil" }
        questions: { type: array, items: { $ref: "#/components/schemas/QuizQuestion" }, description: "Hanya untuk pengajar/admin dengan drafts=true" }
    QuizList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Quiz" } }
    QuestionInput:
      type: object
      required: [prompt, options, answer]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1, description: "Required for existing resource writes; stale values return draft_conflict (409)" }
        prompt: { type: string, minLength: 1, maxLength: 500 }
        options: { type: array, minItems: 2, maxItems: 4, items: { type: string, minLength: 1, maxLength: 200 } }
        answer: { type: integer, minimum: 0, maximum: 3, description: "Indeks pilihan benar" }
        explanation: { type: string, maxLength: 500 }
    QuizQuestion:
      type: object
      required: [id, prompt, options, answer, explanation]
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string }
        options: { type: array, items: { type: string } }
        answer: { type: integer }
        explanation: { type: string }
    AttemptQuestion:
      type: object
      required: [prompt, options, answer, explanation]
      properties:
        prompt: { type: string }
        options: { type: array, items: { type: string } }
        answer: { type: integer, nullable: true, description: "Null sampai percobaan selesai" }
        explanation: { type: string, nullable: true, description: "Null sampai percobaan selesai" }
    QuizAttempt:
      type: object
      required: [id, quiz_id, questions, answers, pass_score, finished, correct, score, passed]
      properties:
        id: { type: string, format: uuid }
        quiz_id: { type: string, format: uuid }
        questions: { type: array, items: { $ref: "#/components/schemas/AttemptQuestion" } }
        answers: { type: array, items: { type: integer }, description: "Pilihan pemanggil; -1 = belum dijawab" }
        pass_score: { type: integer }
        finished: { type: boolean }
        correct: { type: integer, nullable: true }
        score: { type: integer, nullable: true, description: "0–100, dibulatkan ke bawah" }
        passed: { type: boolean, nullable: true }
    GradebookModule:
      type: object
      required: [id, title, building_key, level, archived, done, total]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        building_key: { type: string }
        level: { type: string }
        archived: { type: boolean }
        done: { type: integer }
        total: { type: integer }
    GradebookQuiz:
      type: object
      required: [id, title, building_key, archived, attempts, best, last]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        building_key: { type: string }
        archived: { type: boolean }
        attempts: { type: integer }
        best: { type: integer, nullable: true }
        last: { type: integer, nullable: true }
    GradebookTask:
      type: object
      required: [id, title, class_name, year_label, building_key, cancelled, due_at, done, total]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        class_name: { type: string }
        year_label: { type: string }
        building_key: { type: string }
        cancelled: { type: boolean }
        due_at: { type: string, format: date-time, nullable: true }
        done: { type: integer }
        total: { type: integer }
    GradebookRow:
      type: object
      required: [user_id, name, class_name, modules_done, modules_total, quizzes_attempted, quizzes_total, average_best]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        class_name: { type: string }
        modules_done: { type: integer }
        modules_total: { type: integer }
        quizzes_attempted: { type: integer }
        quizzes_total: { type: integer }
        average_best: { type: number, nullable: true }
    GradebookPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GradebookRow" } }
        total: { type: integer }
    StudentGradebook:
      type: object
      required: [user_id, name, modules, quizzes, assignments, average_best]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        modules: { type: array, items: { $ref: "#/components/schemas/GradebookModule" } }
        quizzes: { type: array, items: { $ref: "#/components/schemas/GradebookQuiz" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/GradebookTask" } }
        average_best: { type: number, nullable: true }
    AssignmentInput:
      type: object
      required: [id, class_id, module_id]
      properties:
        id: { type: string, format: uuid, description: Client-generated retry-safe ID }
        class_id: { type: string, format: uuid }
        module_id: { type: string, format: uuid }
        due_at: { type: string, format: date-time, nullable: true }
    Assignment:
      type: object
      required: [id, title, class_name, year_label, building_key, level, due_at, cancelled, done, total]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        class_name: { type: string }
        year_label: { type: string }
        building_key: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        due_at: { type: string, format: date-time, nullable: true }
        cancelled: { type: boolean }
        done: { type: integer }
        total: { type: integer }
    AssignmentStep:
      type: object
      required: [id, kind, title, body, file_id, file_kind, video_id, quiz_id, minutes, done, unlocked]
      properties:
        rich_content: { $ref: "#/components/schemas/RichContent" }
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/StepKind" }
        title: { type: string }
        body: { type: string }
        file_id: { type: string, format: uuid, nullable: true }
        file_kind: { type: string, enum: [pdf, audio], nullable: true }
        video_id: { type: string, nullable: true }
        quiz_id: { type: string, format: uuid, nullable: true }
        minutes: { type: integer }
        done: { type: boolean }
        unlocked: { type: boolean }
    AssignmentRecipient:
      type: object
      required: [user_id, display_name, done, total]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        done: { type: integer }
        total: { type: integer }
    AcademicYear:
      type: object
      required: [id, label, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: "2026/2027" }
        active: { type: boolean }
    ClassInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
    SchoolClass:
      type: object
      required: [id, academic_year_id, name, students, subject_teachers, homeroom, my_role]
      properties:
        id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        name: { type: string }
        students: { type: integer, description: "Jumlah siswa aktif" }
        subject_teachers: { type: integer, description: "Jumlah guru mapel aktif" }
        homeroom: { allOf: [{ $ref: "#/components/schemas/Person" }], nullable: true, description: "Null = belum ada wali kelas" }
        my_role: { type: string, nullable: true, enum: [homeroom, subject, null], description: "Peran pemanggil di kelas ini" }
    Person:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ClassTeacher:
      type: object
      required: [user_id, display_name, role, subject]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        role: { type: string, enum: [homeroom, subject] }
        subject: { type: string, nullable: true }
    RosterEntry:
      type: object
      required: [user_id, display_name, avatar_key, class_id]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_key: { type: string }
        class_id: { type: string, format: uuid, nullable: true, description: "Null = belum ditempatkan" }
    Placement:
      type: object
      required: [class_name, year_label, started_at, ended_at]
      properties:
        class_name: { type: string }
        year_label: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, description: "Null = masih di kelas ini" }
    Shelf:
      type: string
      enum: [dongeng, novel, komik, sains, matematika, sejarah, inggris, referensi]
    BookInput:
      type: object
      required: [title, author, shelf, level, format, copies, cover, published]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        author: { type: string, minLength: 1, maxLength: 120 }
        shelf: { $ref: "#/components/schemas/Shelf" }
        level: { type: string, enum: [SD, SMP, SMA, Umum] }
        format: { type: string, enum: [buku, ebook, audio] }
        copies: { type: integer, minimum: 0, maximum: 999, description: "Eksemplar fisik; selalu 0 untuk ebook/audio" }
        file_id: { type: string, format: uuid, nullable: true }
        cover: { type: string, enum: [ipa, matematika, sejarah, bahasa, kreatif, diskusi, kelas, arena] }
        published: { type: boolean }
    Book:
      allOf:
        - $ref: "#/components/schemas/BookInput"
        - type: object
          required: [id, sample, position, updated_at, available, my_loan]
          properties:
            id: { type: string, format: uuid }
            sample: { type: boolean, description: "Buku contoh dari seed, boleh dihapus" }
            position: { type: integer }
            updated_at: { type: string, format: date-time }
            available: { type: integer, description: "Buku fisik: eksemplar yang tidak sedang dipinjam" }
            my_loan:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/MyLoan" }]
    MyLoan:
      type: object
      required: [id, due_at]
      properties:
        id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }
    Loan:
      type: object
      required: [id, book_id, title, author, cover, borrowed_at, due_at, returned_at]
      properties:
